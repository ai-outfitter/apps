"""Any graph node."""
interface Node {
  id: ID!
  typeId: ID!
  revision: Int!
  title: String!
  body: String
  archived: Boolean!
  updatedAt: DateTime
  properties: JSON
  summary: String
  slug: String

  """
  Edges of any type touching this node, each with from and to: one bounded, ordered page, read for every node of a level at once.
  """
  edges(
    """Edge type names or IDs."""
    types: [String!]
    direction: Direction = BOTH
    first: Int = 100
    after: String
    orderBy: EdgeOrder = ID_ASC
    filter: EdgeFilter
    at: DateTime
    archived: Archived = EXCLUDE
  ): EdgeConnection!
}

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

"""Any JSON value."""
scalar JSON

type EdgeConnection {
  edges: [EdgeConnectionEdge!]!
  nodes: [Edge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EdgeConnectionEdge {
  cursor: String!
  node: Edge!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

enum Direction {
  OUTGOING
  INCOMING
  BOTH
}

"""
How edges are ordered: by a column (createdAt and updatedAt are when the record was written), ties by ID.
"""
enum EdgeOrder {
  ID_ASC
  ID_DESC
  CREATED_AT_ASC
  CREATED_AT_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
  TITLE_ASC
  TITLE_DESC
}

input EdgeFilter {
  id: IDFilter
  title: StringFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  and: [EdgeFilter!]
  or: [EdgeFilter!]
  not: EdgeFilter
}

"""
Conditions on one id field of a filter; every one given must hold, and a filter holds at most 20. They run in the database.
"""
input IDFilter {
  isNull: Boolean
  equalTo: ID
  notEqualTo: ID
  in: [ID!]
  notIn: [ID!]
  lessThan: ID
  lessThanOrEqualTo: ID
  greaterThan: ID
  greaterThanOrEqualTo: ID
}

"""
Conditions on one string field of a filter; every one given must hold, and a filter holds at most 20. They run in the database. includes and startsWith match literally; Insensitive ignores ASCII case.
"""
input StringFilter {
  isNull: Boolean
  equalTo: String
  notEqualTo: String
  in: [String!]
  notIn: [String!]
  lessThan: String
  lessThanOrEqualTo: String
  greaterThan: String
  greaterThanOrEqualTo: String
  includes: String
  includesInsensitive: String
  startsWith: String
  startsWithInsensitive: String
}

"""
Conditions on one date-time field of a filter; every one given must hold, and a filter holds at most 20. They run in the database.
"""
input DateTimeFilter {
  isNull: Boolean
  equalTo: DateTime
  notEqualTo: DateTime
  in: [DateTime!]
  notIn: [DateTime!]
  lessThan: DateTime
  lessThanOrEqualTo: DateTime
  greaterThan: DateTime
  greaterThanOrEqualTo: DateTime
}

"""
EXCLUDE (default) hides archived records; on relationships also retired ones, as graph.query traversal does.
"""
enum Archived {
  EXCLUDE
  INCLUDE
  ONLY
}

