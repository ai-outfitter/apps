"""Any graph node."""
interface Node {
  id: ID!
  typeId: ID!
  revision: Int!
  title: String!
  body: String
  archived: Boolean!
  updatedAt: DateTime
  properties: JSON
  summary: String
  slug: String

  """Edges of any type touching this node, each with from and to."""
  edges(
    """Edge type names or IDs."""
    types: [String!]
    direction: Direction = BOTH
    at: DateTime
    archived: Archived = EXCLUDE
  ): [Edge!]!
}

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

"""Any JSON value."""
scalar JSON

enum Direction {
  OUTGOING
  INCOMING
  BOTH
}

"""
EXCLUDE (default) hides archived records; on relationships also retired ones, as graph.query traversal does.
"""
enum Archived {
  EXCLUDE
  INCLUDE
  ONLY
}

"""Any stored relationship."""
interface Edge {
  id: ID!
  typeId: ID!
  revision: Int!
  title: String!
  body: String
  archived: Boolean!
  updatedAt: DateTime
  properties: JSON
  fromId: ID!
  toId: ID!
  from: Node
  to: Node
  validFrom: DateTime
  validUntil: DateTime
}

