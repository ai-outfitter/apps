"""
How nodes are ordered: by a column (createdAt and updatedAt are when the record was written), ties by ID.
"""
enum NodeOrder {
  ID_ASC
  ID_DESC
  CREATED_AT_ASC
  CREATED_AT_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
  TITLE_ASC
  TITLE_DESC
}

input NodeFilter {
  id: IDFilter
  slug: StringFilter
  title: StringFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  and: [NodeFilter!]
  or: [NodeFilter!]
  not: NodeFilter
}

