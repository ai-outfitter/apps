    """Edge type names or IDs."""
    types: [String!]
    direction: Direction = BOTH
    first: Int = 100
    after: String
    orderBy: EdgeOrder = ID_ASC
    filter: EdgeFilter
    at: DateTime
    archived: Archived = EXCLUDE
  ): EdgeConnection!
  validFrom: DateTime
  validUntil: DateTime
  usesView(first: Int = 100, after: String, orderBy: KnowledgeGraphOrder = ID_ASC, filter: KnowledgeGraphFilter, at: DateTime, archived: Archived = EXCLUDE): KnowledgeGraphConnection!
  usesViewEdges(first: Int = 100, after: String, orderBy: EdgeOrder = ID_ASC, filter: EdgeFilter, at: DateTime, archived: Archived = EXCLUDE): UsesViewConnection!
