type Query {
  """The onboarding interview that builds the brand document, in order."""
  brandQuestions: [BrandQuestion!]!
  brandAnswers(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: BrandAnswerOrder = ID_ASC

    """Match text across this collection’s text fields."""
    search: String
  ): BrandAnswerConnection!
  sources(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: SourceOrder = ID_ASC
    filter: SourceFilter

    """Match text across this collection’s text fields."""
    search: String
  ): SourceConnection!
  contentProfiles(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: ContentProfileOrder = ID_ASC

    """Match text across this collection’s text fields."""
    search: String
  ): ContentProfileConnection!
  mapNodes(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: MapNodeOrder = ID_ASC
    filter: MapNodeFilter

    """Match text across this collection’s text fields."""
    search: String
  ): MapNodeConnection!
  drafts(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: DraftOrder = ID_ASC
    filter: DraftFilter

    """Match text across this collection’s text fields."""
    search: String
  ): DraftConnection!
  brandWikiBatches(
    first: Int = 100
    after: String
    ids: [ID!]
    orderBy: BrandWikiBatchRowOrder = ID_ASC

    """Match text across this collection’s text fields."""
    search: String
  ): BrandWikiBatchRowConnection!
}

"""
One onboarding interview question; its answer is the BrandAnswer with the same id.
"""
type BrandQuestion {
  id: ID!
  section: String!
  sectionTitle: String!
  text: String!
  hint: String
}

type BrandAnswerConnection {
  edges: [BrandAnswerConnectionEdge!]!
  nodes: [BrandAnswer!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type BrandAnswerConnectionEdge {
  cursor: String!
  node: BrandAnswer!
}

type BrandAnswer {
  id: ID!
  answer: String!
  revision: Float!
  updatedAt: DateTime!
}

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""How BrandAnswer records are ordered, ties by ID."""
enum BrandAnswerOrder {
  ID_ASC
  ID_DESC
}

type SourceConnection {
  edges: [SourceConnectionEdge!]!
  nodes: [Source!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SourceConnectionEdge {
  cursor: String!
  node: Source!
}

type Source {
  id: ID!
  kind: String!
  name: String!
  platform: String!
  handle: String!
  url: String!
  examples: String!
  notes: String!
  revision: Float!
  updatedAt: DateTime!
}

"""How Source records are ordered, ties by ID."""
enum SourceOrder {
  ID_ASC
  ID_DESC
}

input SourceFilter {
  kind: StringFilter
  and: [SourceFilter!]
  or: [SourceFilter!]
  not: SourceFilter
}

"""
Conditions on one string field of a filter; every one given must hold, and a filter holds at most 20. They run in the database. includes and startsWith match literally; Insensitive ignores ASCII case.
"""
input StringFilter {
  isNull: Boolean
  equalTo: String
  notEqualTo: String
  in: [String!]
  notIn: [String!]
  lessThan: String
  lessThanOrEqualTo: String
  greaterThan: String
  greaterThanOrEqualTo: String
  includes: String
  includesInsensitive: String
  startsWith: String
  startsWithInsensitive: String
}

type ContentProfileConnection {
  edges: [ContentProfileConnectionEdge!]!
  nodes: [ContentProfile!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ContentProfileConnectionEdge {
  cursor: String!
  node: ContentProfile!
}

type ContentProfile {
  id: ID!
  coreIdeas: String!
  voice: String!
  worldview: String!
  patterns: String!
  revision: Float!
  updatedAt: DateTime!
}

"""How ContentProfile records are ordered, ties by ID."""
enum ContentProfileOrder {
  ID_ASC
  ID_DESC
}

type MapNodeConnection {
  edges: [MapNodeConnectionEdge!]!
  nodes: [MapNode!]!
  pageInfo: PageInfo!
