"""How MapNode records are ordered, ties by ID."""
enum MapNodeOrder {
  ID_ASC
  ID_DESC
  POSITION_ASC
  POSITION_DESC
}

input MapNodeFilter {
  level: StringFilter
  parentId: IDFilter
  and: [MapNodeFilter!]
  or: [MapNodeFilter!]
  not: MapNodeFilter
