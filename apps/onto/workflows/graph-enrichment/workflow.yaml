version: beta
id: graph-enrichment
summary: Propose graph enrichment from recent threads, an existing node, or authorized repository sources.
actors: {}
triggers:
  - on: manual
  - on: schedule
    cron: "0 9 * * *"
steps:
  - id: explore
    inference: {maxOutputTokens: 4000, timeoutMs: 75000}
    inputs:
      prompt:
        schema: {type: string, maxLength: 2000}
        default: ""
      node:
        schema: {type: string, format: uuid}
      repositories:
        schema: {type: array, minItems: 1, maxItems: 4, items: {type: string, maxLength: 500}}
    outputs:
      result:
        connector: database
        record: graph-enrichment.review
        schema:
          type: object
          properties:
            state: {type: string}
            batchId: {type: [string, "null"]}
          required: [state, batchId]
outputs:
  result: explore.outputs.result
