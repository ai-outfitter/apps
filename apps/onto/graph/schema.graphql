type Query {
  """
  Search saved change batches; operations and evidence are selected explicitly.
  """
  changeBatches(first: Int = 100, after: String, ids: [ID!], search: String, state: [String!]): ChangeBatchConnection!

  """Saved explorations in this Wiki, by title."""
  explorations: [ExplorationSummary!]!

  """
  One exploration and its picture, rebuilt from current records; null when there is none.
  """
  exploration(slug: String!): Exploration

  """
  One change batch, with every operation and its state; null when there is none.
  """
  changeBatch(id: ID!): ChangeBatch
}

type ChangeBatchConnection {
  nodes: [ChangeBatch!]!
  pageInfo: PageInfo!
  aggregate: Aggregate!
}

"""
Proposed Wiki changes, invisible to every read until a member commits them on the Changes page.
"""
type ChangeBatch {
  id: ID!
  title: String!
  purpose: String!

  """open, awaiting_review, committed, rejected or discarded."""
  state: String!
  source: JSON
  createdAt: DateTime!
  policy: JSON!
  summary: JSON
  reviewBy: DateTime

  """
  The ontology steward's latest advisory review: state, findings by operation ref, coverage, prompt digest and its batch-review workflow run, whose logs are the audit trail. It never approves or blocks anything.
  """
  review: JSON
  expiresAt: DateTime!
  updatedAt: DateTime!

  """Operations by state."""
  counts: JSON!
  instructions: [ChangeInstruction!]!
  operations(
    """
    Read only these proposal refs; omit for all. Use to inspect individual proposals when the whole batch exceeds the response limit.
    """
    refs: [String!]
  ): [StagedChange!]!
}

"""Any JSON value."""
scalar JSON

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

type ChangeInstruction {
  code: String!
  itemKey: String!
  actor: String!
  required: Boolean!
  message: String!
  call: JSON
  taskId: String
  url: String
}

"""One proposed graph.apply operation in a batch."""
type StagedChange {
  ref: String!

  """pending, awaiting_review, committed or rejected."""
  state: String!
  operation: JSON!
  evidence: JSON!
  confidence: Float
  reason: String

  """Who or which policy decided it, and when."""
  decision: JSON

  """The committed record: a type name, node slug or edge type:from:to."""
  record: String
  recordRevision: Int
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Aggregate {
  count: Int!
}

type ExplorationSummary {
  slug: String!
  title: String!
  revision: Int!
  start: JSON!
}

"""
A saved view of this Wiki's graph that members and agents change together. It stores steps, never facts.
"""
type Exploration {
  slug: String!
  title: String!

  """Send it as expectedRevision with the next patch."""
  revision: Int!

  """
  {title, start: {type, slug}, steps: {<key>: {from, path, direction?, limit?, type?}}, hidden: {<node key>: true}, focus?, direction?}; patch it with MutateExploration.
  """
  state: JSON!

  """
  {by, via, summary, nodes}: the latest change and the node keys it added.
  """
  lastChange: JSON
  picture: ExplorationPicture!
  dryRun: Boolean
}

"""
The nodes and relationships an exploration's steps reach now, rebuilt on every read.
"""
type ExplorationPicture {
  nodes: [ExplorationNode!]!
  edges: [ExplorationEdge!]!
  steps: [ExplorationStepResult!]!

  """The picture reached its 300-node limit."""
  truncated: Boolean!
}

"""A record in an exploration's picture."""
type ExplorationNode {
  """
  <Type>:<slug> (Onto's node address); steps, hidden and focus name nodes by it.
  """
  key: String!
  type: String!
  title: String!
  slug: String
  id: ID!

  """The step that added it; null for the start."""
  step: String

  """Its website; a pull request's GitHub page."""
  url: String

  """
  The change batch proposing it; set only for staged records a member has not committed (key proposed:<batch>/<ref>).
  """
  proposedIn: ID
}

"""A relationship between two nodes in the picture."""
type ExplorationEdge {
  from: String!
  to: String!
  label: String!
}

"""What one step reached."""
type ExplorationStepResult {
  key: String!
  count: Int!

  """The step's limit cut it."""
  truncated: Boolean!
  error: String
}

input MutateExplorationInput {
  slug: String!
  expectedRevision: Float!
  patch: JSON!
  summary: String
  dryRun: Boolean
}

input ReviewBatchInput {
  batchId: ID!
  refs: [String!]
  verdict: ReviewBatchInputVerdict!
  comment: String
}

enum ReviewBatchInputVerdict {
  approve
  reject
}

input StageChangesInput {
  batchId: ID
  title: String
  purpose: String
  source: StageChangesInputSource
  proposals: [StageChangesInputProposalsItem!]!
}

input StageChangesInputSource {
  kind: String!
  ref: String!
  label: String
}

input StageChangesInputProposalsItem {
  operation: JSON!
  evidence: [StageChangesInputProposalsItemEvidenceItem!]
  confidence: Float
  reason: String
}

input StageChangesInputProposalsItemEvidenceItem {
  provider: String!
  recordId: String!
  version: String
  uri: String
  contentHash: String
  quote: String
  observedAt: String
}

input RemoveStagedChangesInput {
  batchId: ID!
  refs: [String!]!
}

input SubmitBatchInput {
  batchId: ID!
  summary: String
}

type Mutation {
  """
  Change what an exploration shows with a merge patch over its state and the revision you read: open a path from a node (steps), hide nodes, or start a new one at expectedRevision 0. Named paths: offerings, products, projects, competitors, issues, repositories, pullRequests (live from GitHub; state open by default); any Wiki edge type name also works. It writes no records: to add a record, stage a change batch. Answers with the new picture.
  """
  mutateExploration(input: MutateExplorationInput!): Exploration!

  """
  Approve or reject submitted changes as an editor: the member in the Wiki, or the member's own agent connection acting with the member's identity. Apps and delegated writers cannot review.
  """
  reviewBatch(input: ReviewBatchInput!): ChangeBatch!

  """
  Stage up to 100 proposals, opening a batch a member reviews when batchId is omitted; a batch that commits by policy (Forerunner's) takes proposals only from whoever opened it. Each proposal is one graph.apply operation with evidence citations, confidence (0-1) and a short reason: {"operation":{"operation":"create","ref":"$ada","type":"graph-node","attributes":{"typeId":"person","title":"Ada"}},"evidence":[{"provider":"gmail","recordId":"<account email>/<message id>","quote":"..."}],"reason":"..."}. Name existing records by handle: typeId takes a type name, fromId and toId take node slugs or refs staged earlier in the batch, and an update names its record (node slug, type name or edge type:from:to) as id with its revision. Re-adding an identical proposal does nothing; a ref already used for another is a conflict.
  """
  stageChanges(input: StageChangesInput!): ChangeBatch!

  """Remove proposals from an open batch by ref."""
  removeStagedChanges(input: RemoveStagedChangesInput!): ChangeBatch!

  """
  Submit an open batch for a member's review on the Changes page. Refused, naming the problem, while an operation would not apply; the batch stays open to fix. The ontology steward then reviews it in the background and attaches advisory findings (review, empty until it finishes); its policy decides exactly as without them.
  """
  submitBatch(input: SubmitBatchInput!): ChangeBatch!

  """Apply changebatch changes using explicit actions"""
  changeBatchChanges(input: ChangeBatchChangesInput!): ChangeResults
}

type ChangeResults {
  items: [ChangeReceipt!]!
  instructions: [ChangeInstruction!]!
}

type ChangeReceipt {
  key: String!
  status: String!
  result: JSON
  error: JSON
}

input ChangeBatchChangesInput {
  items: [ChangeBatchChangesInputItemsItem!]!
}

input ChangeBatchChangesInputItemsItem {
  key: String!
  action: ChangeBatchChangesInputItemsItemAction!
  input: JSON!
}

enum ChangeBatchChangesInputItemsItemAction {
  stage
  remove
  submit
  review
}
