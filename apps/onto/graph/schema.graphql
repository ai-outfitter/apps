type Mutation {
  """
  Create and submit a member batch, submit an open member draft, replace or add undecided proposals by ref, withdraw refs, or delete an open draft with deleteBatch:true. The saved submission queues undecided proposals for steward review under the existing policy. Pass the observed expectedVersion for an existing batch. Retry identical inputs with the original requestKey.
  """
  mutateBatchSubmission(input: MutateBatchSubmissionInput!): BatchSubmissionResult!

  """
  Amend undecided proposals by ref, add proposals or withdraw refs in an open or submitted batch. Keeps the batch pending review, preserves decisions and commits no graph records. Entity writers can edit member batches. Policy batches require the originating app or a member reviewer.
  """
  reviseBatch(input: ReviseBatchInput!): ChangeBatch!

  """
  Ask a member about proposals in an open batch, or one awaiting member review: [{key, ask, refs, options?}]. refs name the proposals that depend on the answer; options are choices the member can pick. The same key replaces a question; a reworded one loses its answer. remove takes questions back. Members answer on the Changes page; answering approves nothing, an unanswered question blocks nothing, and questions close with the batch.
  """
  askBatch(input: AskBatchInput!): ChangeBatch!

  """
  Change what an exploration shows with a merge patch over its state and the revision you read: open a path from a node (steps), hide nodes, or start a new one at expectedRevision 0. Named paths: offerings, products, projects, competitors, issues, repositories, pullRequests (live from GitHub; state open by default); any Wiki edge type name also works. It writes no records: to add a record, stage a change batch. Answers with the new picture.
  """
  mutateExploration(input: MutateExplorationInput!): Exploration!

  """
  Editors only. Create or change what this graph shows another organization with a merge patch over {title, organization, graph, roots, hidden} and the revision you read (0 creates). organization is an Organization node address, graph a KnowledgeGraph address whose relationships, stop types and maxDepth decide what is reached, roots and hidden are {"Type:slug": true}. archived:true stops it. Answers with what the organization would read.
  """
  mutateShare(input: MutateShareInput!): Share!

  """
  Admins only: change this Onto's settings. stewardApproval approve lets the ontology steward approve what its review of a submitted batch found clean; review leaves every decision to a member.
  """
  saveSettings(input: SaveSettingsInput!): OntoSettings!

  """
  Approve, reject or request changes on submitted proposals as an editor: the member in the Wiki, or the member's own agent connection acting with the member's identity. Pass the observed submittedVersion as expectedVersion to reject a stale review. Requesting changes requires the version and a comment. Approve and reject callers can omit the version to decide the current submission. Apps and delegated writers cannot review.
  """
  reviewBatch(input: ReviewBatchInput!): ChangeBatch!

  """
  Stage a typed creative record for ordinary graph review. No generation or approval occurs.
  """
  stageCreativeRecord(input: StageCreativeRecordInput!): JSON

  """
  Resolve committed prompt fragments and stage an immutable snapshot for review. Does not generate media.
  """
  freezeCreativeInputs(input: FreezeCreativeInputsInput!): JSON

  """Stage a typed creative record named by Type:slug through graph review."""
  stageCreativeRecordAtAddress(input: StageCreativeRecordAtAddressInput!): JSON

  """Resolve a named committed prompt and stage a new immutable snapshot."""
  freezeCreativeInputsAtAddress(input: FreezeCreativeInputsAtAddressInput!): JSON

  """
  Stage up to 100 proposals, opening a batch a member reviews when batchId is omitted; a batch that commits by policy (Forerunner's) takes proposals only from whoever opened it. Each proposal is one graph.apply operation with evidence citations, confidence (0-1) and a short reason: {"operation":{"operation":"create","ref":"$ada","type":"graph-node","attributes":{"typeId":"Person","title":"Ada"}},"evidence":[{"provider":"gmail","recordId":"<account email>/<message id>","quote":"..."}],"reason":"..."}. Name existing records by address: typeId takes a type name (Person), fromId and toId take node addresses (Organization:sunny) or refs staged earlier in the batch, and an update names its record (Person, Organization:sunny or works_on(Person:ada → Project:sunny), with @<validFrom> when the edge has a start) as id with its revision. A new batch is anchored to the root (the organization's Organization node, or the owner's Person in a personal graph): every new node must connect to it. Pass anchors (node addresses) only when the member asks for a narrower scope; [] removes the requirement. Re-adding an identical proposal does nothing; a ref already used for another is a conflict unless replace:true explicitly replaces it, including evidence and reason. Read validation in the result and repair until valid before submitting. advice holds Onto's plain checks on the draft; the steward's review of the draft follows in review.
  """
  stageChanges(input: StageChangesInput!): ChangeBatch!

  """
  Replace anchor nodes of an open batch or an undecided batch awaiting member review. Submitted proposals must already connect to the selected anchors. Empty anchors removes the connectivity requirement. Returns current validation without applying any records.
  """
  configureBatch(input: ConfigureBatchInput!): ChangeBatch!

  """Remove proposals from an open batch by ref."""
  removeStagedChanges(input: RemoveStagedChangesInput!): ChangeBatch!

  """
  Submit an open batch for review. Refused, naming the problem, while an operation would not apply; the batch stays open to fix. The ontology steward then reviews it in the background: reviewRun and the WAIT_FOR_RUN instruction (taskId) name the workflow run to wait on. Unless an admin set stewardApproval to review, it then approves every proposal it found clean; proposals with an error or warning finding or a question, and what depends on them, wait for a member (review.decision says which and why).
  """
  submitBatch(input: SubmitBatchInput!): ChangeBatch!

  """Apply changebatch changes using explicit actions"""
  changeBatchChanges(input: ChangeBatchChangesInput!): ChangeResults
}

type ChangeResults {
  items: [ChangeReceipt!]!
  instructions: [ChangeInstruction!]!
}

type ChangeReceipt {
  key: String!
  status: String!
  result: JSON
  error: JSON
}

input ChangeBatchChangesInput {
  items: [ChangeBatchChangesInputItemsItem!]!
}

input ChangeBatchChangesInputItemsItem {
  key: String!
  action: ChangeBatchChangesInputItemsItemAction!
  input: JSON!
}

enum ChangeBatchChangesInputItemsItemAction {
  amend
  stage
  configure
  ask
  remove
  submit
  review
}
