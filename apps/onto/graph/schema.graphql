type Query {
  creativeRecords(kind: String, after: String, limit: Int): JSON
  creativeRecordViews(kind: String, after: String, limit: Int): JSON

  """
  Start here before reading or writing this graph: every type name, which node types each relationship connects, the root node, and how to stage a change.
  """
  ontology: Ontology!

  """
  Search saved change batches; operations and evidence are selected explicitly.
  """
  changeBatches(first: Int = 100, after: String, ids: [ID!], search: String, state: [String!]): ChangeBatchConnection!

  """Saved explorations in this Wiki, by title."""
  explorations: [ExplorationSummary!]!

  """
  One exploration and its picture, rebuilt from current records; null when there is none.
  """
  exploration(slug: String!): Exploration

  """
  What this graph shows other organizations, by title. Select view to see what each one reads.
  """
  shares: [Share!]!

  """
  One share and what its organization reads now; null when there is none.
  """
  share(slug: String!): Share

  """
  This Onto's settings, such as whether the ontology steward approves what it found clean.
  """
  settings: OntoSettings!

  """
  One change batch, with every operation and its state; null when there is none.
  """
  changeBatch(id: ID!): ChangeBatch
}

"""Any JSON value."""
scalar JSON

type Ontology {
  """Address of the node every new node connects to by default."""
  root: String
  nodeTypes: [OntologyNodeType!]!
  relationshipTypes: [OntologyRelationshipType!]!

  """How to stage a change to this graph."""
  staging: String!
}

type OntologyNodeType {
  name: String!
  description: String!
}

type OntologyRelationshipType {
  name: String!
  description: String!

  """Node type names allowed at the start; any allows every type."""
  from: [String!]!

  """Node type names allowed at the end; any allows every type."""
  to: [String!]!
}

type ChangeBatchConnection {
  edges: [ChangeBatchConnectionEdge!]!
  nodes: [ChangeBatch!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ChangeBatchConnectionEdge {
