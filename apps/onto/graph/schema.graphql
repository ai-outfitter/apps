"""
Proposed Wiki changes, invisible to every read until they commit: by policy, by the ontology steward after its review, or by a member on the Changes page.
"""
type ChangeBatch {
  id: ID!
  title: String!
  purpose: String!

  """
  Latest recorded submission; zero for drafts and batches predating version tracking.
  """
  submittedVersion: Int!

  """
  Immutable proposal content and submitter for this version; legacy baseline zero has unknown authorship.
  """
  submission(version: Int!): JSON

  """open, awaiting_review, committed, rejected or discarded."""
  state: String!
  source: JSON
  createdAt: DateTime!

  """Anchor node addresses; every created node must connect to one."""
  anchors: [String!]!

  """
  Current dry-run result: valid, error and operations. valid=false means repair the draft before submitting; nothing has been applied.
  """
  validation: JSON!
  policy: JSON!
  summary: JSON
  reviewBy: DateTime

  """
  The review page, relative to this installation (the platform returns it as a full link).
  """
  reviewUrl: String

  """
  The ontology steward's latest review, of the open draft or the submitted batch (stage): state, findings by operation ref, coverage, prompt digest and its batch-review workflow run, whose logs are the audit trail. Null while a new draft is being reviewed. For a submitted batch, decision says what the steward approved after its review and which refs it left for a member, with why.
  """
  review: JSON
  expiresAt: DateTime!
  updatedAt: DateTime!

  """Operations by state."""
  counts: JSON!

  """
  Local member requests for changes, with proposal refs, observed version, reviewer and comment. Retained after edits and final decisions.
  """
  changeRequests: JSON!

  """
  Questions asked on this batch: [{key, ask, refs, options?, answer?: {option or text, by, at}}]. refs are the proposals that depend on it. Cite an answer as evidence {provider: "onto", recordId: "batch:<id>#<key>"} when you revise those proposals.
  """
  questions: JSON!

  """
  Onto's built-in advice on the draft, with no model: records that need a type (type.generic-cluster, edge.generic-cluster, property.in-title), too many types (type.sprawl) and card quality (card.*, evidence.quote-too-long). Each finding names its refs; stage.proposals can be staged as they are and stage.move lists the refs to restage under them. Advisory: nothing is blocked.
  """
  advice: JSON!

  """
  While the ontology steward reviews a submitted batch: {runId, state}, the batch-review workflow run to wait on (WorkflowRuns at scope platform). Null once the review has finished; read review then.
  """
  reviewRun: JSON
  instructions: [ChangeInstruction!]!
  operations(
    """
    Read only these proposal refs; omit for all. Use to inspect individual proposals when the whole batch exceeds the response limit.
    """
    refs: [String!]
  ): [StagedChange!]!
}

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

type ChangeInstruction {
  code: String!
  itemKey: String!
  actor: String!
  required: Boolean!
  message: String!
  call: JSON
  taskId: String
  url: String
}

"""One proposed graph.apply operation in a batch."""
type StagedChange {
  ref: String!

  """pending, awaiting_review, committed or rejected."""
  state: String!
  operation: JSON!
  evidence: JSON!
  confidence: Float
  reason: String

  """Who or which policy decided it, and when."""
  decision: JSON

  """
  The committed record's address: Person, Organization:sunny or works_on(Person:ada → Project:sunny).
  """
  record: String
  recordRevision: Int
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ExplorationSummary {
  slug: String!
  title: String!
  revision: Int!
  start: JSON!
}

"""
A saved view of this Wiki's graph that members and agents change together. It stores steps, never facts.
"""
type Exploration {
  slug: String!
  title: String!

  """Send it as expectedRevision with the next patch."""
  revision: Int!

  """
  {title, start: {type, slug}, steps: {<key>: {from, path, direction?, limit?, type?}}, hidden: {<node key>: true}, focus?, direction?}; patch it with MutateExploration.
  """
  state: JSON!

  """
  {by, via, summary, nodes}: the latest change and the node keys it added.
  """
  lastChange: JSON
  picture: ExplorationPicture!
  dryRun: Boolean
}

"""
The nodes and relationships an exploration's steps reach now, rebuilt on every read.
"""
type ExplorationPicture {
  nodes: [ExplorationNode!]!
  edges: [ExplorationEdge!]!
  steps: [ExplorationStepResult!]!

  """The picture reached its 300-node limit."""
  truncated: Boolean!
}

"""A record in an exploration's picture."""
type ExplorationNode {
  """
  <Type>:<slug> (Onto's node address); steps, hidden and focus name nodes by it.
  """
  key: String!
  type: String!
  title: String!
  slug: String
  id: ID!

  """The step that added it; null for the start."""
  step: String

  """Its website; a pull request's GitHub page."""
  url: String

  """
  The change batch proposing it; set only for staged records a member has not committed (key proposed:<batch>/<ref>).
  """
  proposedIn: ID
}

"""A relationship between two nodes in the picture."""
type ExplorationEdge {
  from: String!
  to: String!
  label: String!
}

"""What one step reached."""
type ExplorationStepResult {
  key: String!
  count: Int!

  """The step's limit cut it."""
  truncated: Boolean!
  error: String
}

"""
What this graph shows another organization: a saved KnowledgeGraph walked from roots, minus hidden nodes. It holds a selection, never a copy.
"""
type Share {
  slug: String!
  title: String!
  revision: Int!
  archived: Boolean!

  """The Organization node it is for, such as Organization:sunny."""
  organization: String!

  """The KnowledgeGraph that picks relationships, types and depth."""
  graph: String!

  """{"Type:slug": true} the walk starts from."""
  roots: JSON!

  """{"Type:slug": true} left out, with anything reached only through them."""
  hidden: JSON!

  """Null while archived."""
  view: ShareView
}

"""
What the organization reads now: current records the KnowledgeGraph reaches from the roots, without hidden nodes.
"""
type ShareView {
  nodes: [ShareNode!]!
  edges: [ShareEdge!]!

  """The KnowledgeGraph's maxNodes or read budget cut the walk."""
  incomplete: Boolean!
}

type ShareNode {
  address: String!
  title: String!
  summary: String
}

type ShareEdge {
  address: String!
}

