  evidence: [ReviseBatchInputProposalsItemEvidenceItem!]
  confidence: Float
  reason: String
}

input ReviseBatchInputProposalsItemEvidenceItem {
  provider: String!
  recordId: String!
  version: String
  uri: String
  contentHash: String
  quote: String
  observedAt: String
}

input MutateExplorationInput {
  slug: String!
  expectedRevision: Float!
  patch: JSON!
  summary: String
  dryRun: Boolean
}

input MutateShareInput {
  slug: String!
  expectedRevision: Float!
  patch: JSON!
  archived: Boolean
}

input ReviewBatchInput {
  batchId: ID!
  refs: [String!]
  verdict: ReviewBatchInputVerdict!
  comment: String
}

enum ReviewBatchInputVerdict {
  approve
  reject
}

input StageChangesInput {
  batchId: ID
  title: String
  purpose: String
  source: StageChangesInputSource
  anchors: [String!]
  proposals: [StageChangesInputProposalsItem!]!
  replace: Boolean
}

input StageChangesInputSource {
  kind: String!
  ref: String!
  label: String
}

input StageChangesInputProposalsItem {
  operation: JSON!
  evidence: [StageChangesInputProposalsItemEvidenceItem!]
  confidence: Float
  reason: String
}

input StageChangesInputProposalsItemEvidenceItem {
  provider: String!
  recordId: String!
  version: String
  uri: String
  contentHash: String
  quote: String
  observedAt: String
}

input ConfigureBatchInput {
  batchId: ID!
  anchors: [String!]!
}

input RemoveStagedChangesInput {
  batchId: ID!
  refs: [String!]!
}

input SubmitBatchInput {
  batchId: ID!
  summary: String
}

type Mutation {
  """
  Amend undecided proposals by ref, add proposals or withdraw refs in an open or submitted member-review batch. Keeps the batch pending review, preserves decisions and commits no graph records. Requires the member's own editor connection; apps and delegated writers cannot amend.
  """
  reviseBatch(input: ReviseBatchInput!): ChangeBatch!

  """
  Change what an exploration shows with a merge patch over its state and the revision you read: open a path from a node (steps), hide nodes, or start a new one at expectedRevision 0. Named paths: offerings, products, projects, competitors, issues, repositories, pullRequests (live from GitHub; state open by default); any Wiki edge type name also works. It writes no records: to add a record, stage a change batch. Answers with the new picture.
  """
  mutateExploration(input: MutateExplorationInput!): Exploration!

  """
  Editors only. Create or change what this graph shows another organization with a merge patch over {title, organization, graph, roots, hidden} and the revision you read (0 creates). organization is an Organization node address, graph a KnowledgeGraph address whose relationships, stop types and maxDepth decide what is reached, roots and hidden are {"Type:slug": true}. archived:true stops it. Answers with what the organization would read.
  """
  mutateShare(input: MutateShareInput!): Share!

  """
  Approve or reject submitted changes as an editor: the member in the Wiki, or the member's own agent connection acting with the member's identity. Apps and delegated writers cannot review.
  """
  reviewBatch(input: ReviewBatchInput!): ChangeBatch!

  """
  Stage up to 100 proposals, opening a batch a member reviews when batchId is omitted; a batch that commits by policy (Forerunner's) takes proposals only from whoever opened it. Each proposal is one graph.apply operation with evidence citations, confidence (0-1) and a short reason: {"operation":{"operation":"create","ref":"$ada","type":"graph-node","attributes":{"typeId":"Person","title":"Ada"}},"evidence":[{"provider":"gmail","recordId":"<account email>/<message id>","quote":"..."}],"reason":"..."}. Name existing records by address: typeId takes a type name (Person), fromId and toId take node addresses (Organization:sunny) or refs staged earlier in the batch, and an update names its record (Person, Organization:sunny or works_on(Person:ada → Project:sunny), with @<validFrom> when the edge has a start) as id with its revision. Pass anchors (node addresses) to require every new node to connect to one. Re-adding an identical proposal does nothing; a ref already used for another is a conflict unless replace:true explicitly replaces it, including evidence and reason. Read validation in the result and repair until valid before submitting.
  """
  stageChanges(input: StageChangesInput!): ChangeBatch!

  """
  Replace anchor nodes of an open batch or an undecided batch awaiting member review. Submitted proposals must already connect to the selected anchors. Empty anchors removes the connectivity requirement. Returns current validation without applying any records.
  """
  configureBatch(input: ConfigureBatchInput!): ChangeBatch!

  """Remove proposals from an open batch by ref."""
  removeStagedChanges(input: RemoveStagedChangesInput!): ChangeBatch!

  """
  Submit an open batch for a member's review on the Changes page. Refused, naming the problem, while an operation would not apply; the batch stays open to fix. The ontology steward then reviews it in the background and attaches advisory findings (review, empty until it finishes); its policy decides exactly as without them.
  """
  submitBatch(input: SubmitBatchInput!): ChangeBatch!

  """Apply changebatch changes using explicit actions"""
  changeBatchChanges(input: ChangeBatchChangesInput!): ChangeResults
}

type ChangeResults {
  items: [ChangeReceipt!]!
  instructions: [ChangeInstruction!]!
}

type ChangeReceipt {
  key: String!
  status: String!
  result: JSON
  error: JSON
}

input ChangeBatchChangesInput {
  items: [ChangeBatchChangesInputItemsItem!]!
}

input ChangeBatchChangesInputItemsItem {
  key: String!
  action: ChangeBatchChangesInputItemsItemAction!
  input: JSON!
}

enum ChangeBatchChangesInputItemsItemAction {
  amend
  stage
  configure
  remove
  submit
  review
}
