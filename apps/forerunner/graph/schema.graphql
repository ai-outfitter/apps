type Query {
  """
  Read the saved personal daily brief, current priorities, yesterday's project and organization reports, and the full previous calendar week's saved reports. No generation starts.
  """
  dailyHome(input: DailyHomeInput!): JSON

  """Read the personal daily brief schedule; no scheduling side effects."""
  dailyBriefSchedule(input: JSON!): JSON

  """
  Read the saved research reports and their schedule; no scheduling side effects.
  """
  researchReportSchedule(input: JSON!): JSON

  """
  Read a completed local day's board completion history and saved organization reports in personal priority order. Reads never start report generation; missing and incomplete sources remain explicit.
  """
  dayReview(input: DayReviewInput!): JSON

  """
  Read saved canonical need identities and revisions for a private discovery selection; excludes raw source samples and uncommitted proposals.
  """
  planningCandidates(input: PlanningCandidatesInput!): JSON
  items(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
    category: [String!]
    status: [String!]
  ): ItemConnection!
  discoveryRecords(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
    kind: [String!]
  ): DiscoveryRecordConnection!

  """
  What the daily runs suggest, newest first: open suggestions unless `status` names others (applied, dismissed). Editors only.
  """
  suggestions(status: [String!]): [Suggestion!]!
}

"""Any JSON value."""
scalar JSON

input DailyHomeInput {
  timezone: String
  includeHistory: Boolean
}

input DayReviewInput {
  date: String
  timezone: String
}

input PlanningCandidatesInput {
  previewId: ID!
}

type ItemConnection {
  nodes: [Item!]!
  pageInfo: PageInfo!
  aggregate: Aggregate!
}

type Item {
  id: ID!
  category: String!
  title: String!
  description: String!
  dueDate: String
  status: String!
  position: Float!
  parentId: ID
  revision: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Aggregate {
  count: Int!
}

type DiscoveryRecordConnection {
  nodes: [DiscoveryRecord!]!
  pageInfo: PageInfo!
  aggregate: Aggregate!
}

type DiscoveryRecord {
  id: ID!
  kind: String!
  createdAt: DateTime!
}

"""
Something the daily run suggests: a new workflow to turn on, a change to one of the member's routines, or an app. Status is open, applied or dismissed.
"""
type Suggestion {
  id: ID!

  """workflow, change or app"""
  kind: String!
  status: String!
  title: String!
  why: String!

  """
  change only: the routine it rewrites, its routine id in platform Schedules
  """
  routineId: ID
  routineName: String

  """workflow: the routine to turn on; change: the routine's whole new task"""
  task: RoutineTask
  appName: String
  appGoal: String
  createdAt: String!
}

"""A recurring task: what a routine does each time, when, and how."""
type RoutineTask {
  title: String!
  description: String!
  cadence: String
  steps: [String!]!
}

