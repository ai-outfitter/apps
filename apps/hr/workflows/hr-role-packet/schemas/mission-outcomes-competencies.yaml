title: Mission, outcomes and competencies
description: Versioned MOC grounded in the confirmed brief.
type: object
additionalProperties: false
required:
  - revision
  - mission
  - outcomes
  - competencies
properties:
  revision:
    type: integer
    minimum: 1
  mission:
    type: string
    minLength: 1
  outcomes:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  competencies:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
