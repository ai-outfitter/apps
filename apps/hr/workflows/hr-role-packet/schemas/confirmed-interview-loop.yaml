title: Confirmed interview loop
description: Interview stages with assigned interviewers and competencies.
type: object
additionalProperties: false
required:
  - stages
properties:
  stages:
    type: array
    minItems: 1
    items:
      title: Interview stage
      description: One stage of the loop.
      type: object
      additionalProperties: false
      required:
        - name
        - focus
      properties:
        name:
          type: string
          minLength: 1
        focus:
          type: string
          minLength: 1
        interviewer:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Organization member or agent identity recorded by the platform
