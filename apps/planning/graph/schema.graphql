type IntakeRoute {
  id: ID!

  """Rises with each recorded result."""
  revision: Int!

  """research, architecture, prioritization, backlog or implementation."""
  kind: String!

  """Kinds whose approved results this work waits for."""
  dependsOn: [String!]!
  rationale: String!
  gate: IntakeGate

  """
  Why the work cannot proceed now; null when it is ready or its result awaits review.
  """
  blocker: String
  claim: IntakeClaim

  """
  The claim holder's unsubmitted draft (savedAt, result); saveResultDraft replaces it, recordResult submits it.
  """
  draft: JSON

  """
  The recorded summary, sources, gaps and, by kind, disposition or architecture.
  """
  result: JSON
  observedAt: String

  """Governance's receipt for the review request of the current result."""
  gateReceipt: JSON
  gateError: String

  """The Foundry delivery once implementation was submitted."""
  receipt: JSON
  submissionIntent: JSON

  """The Governance subject: ref, revision and digest of this work record."""
  subject: JSON
}

