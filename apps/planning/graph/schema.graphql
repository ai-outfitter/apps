"""Any JSON value."""
scalar JSON

"""
A design partner's feature or bug request, filed from its own organization.
"""
type PartnerRequest {
  id: ID!

  """The partner's own ID for it."""
  requestId: ID!
  revision: Int!

  """
  proposed until an editor accepts (Software Foundry files it as an issue) or rejects it.
  """
  status: PartnerRequestStatus!

  """feature or bug."""
  kind: String!
  title: String!
  problem: String!

  """[{ id, text }]"""
  acceptanceCriteria: JSON!

  """Bugs only: { stepsToReproduce, expected, actual, environment? }."""
  bug: JSON

  """The provider's product record, by the ID both graphs share."""
  productId: ID

  """{ organizationId, userId, role: "design partner" }"""
  partner: JSON!

  """Why it was rejected."""
  reason: String

  """
  Once accepted: Foundry's request { requestId, kind, issue { number, url }, run }.
  """
  foundryRequest: JSON

  """Epoch milliseconds."""
  createdAt: Float!
  updatedAt: Float!
}

enum PartnerRequestStatus {
  proposed
  accepted
  rejected
}

