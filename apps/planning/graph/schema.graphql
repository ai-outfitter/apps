"""What changed in a project since its previous digest."""
type ProjectDigest {
  id: ID!
  projectId: ID!

  """manual (a member's click) or schedule (the morning run)."""
  trigger: String!

  """
  When the previous digest was taken; null for a project's first digest, which covers the last 24 hours.
  """
  since: DateTime
  createdAt: DateTime!

  """
  The AI narrative: a headline line, a blank line, then a few sentences. Null when inference was unavailable.
  """
  summary: String

  """Why there is no summary, when there is none."""
  summaryError: String

  """
  shipped, started, added, reopened, edited and removed issues ({ id, title, category, status }, at most 20 each); counts (exact); changed project documents by label; delivery { submitted, accepted }; current priorities (in-progress first, then top open stones and pebbles); totals { open, inProgress, done }.
  """
  changes: JSON!
}

