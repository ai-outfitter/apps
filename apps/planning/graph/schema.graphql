type Mutation {
  """
  Seal a production for a verified transfer; blocks further source writes.
  """
  beginVideoTransfer(input: BeginVideoTransferInput!): JSON

  """
  Read a sealed source through its authorized app and preserve revisions and receipts. Media must still be copied.
  """
  importVideoTransfer(input: ImportVideoTransferInput!): JSON

  """Verify destination metadata and media before recording completion."""
  finishVideoTransfer(input: FinishVideoTransferInput!): JSON

  """
  Save a storyboard at its current revision; zero creates a stable production ID. Editors only.
  """
  saveVideoProduction(input: SaveVideoProductionInput!): JSON

  """
  Freeze one shot for a new take ID. Does not spend; an authorized executor submits the returned request.
  """
  prepareVideoTake(input: PrepareVideoTakeInput!): JSON

  """
  Claim submission before calling the provider; persist the receipt before polling; never automatically resubmit uncertain requests.
  """
  updateVideoTake(input: UpdateVideoTakeInput!): JSON

  """
  Reserve a private file upload with exact size and SHA256. PUT the returned upload then commit it.
  """
  reserveVideoAsset(input: ReserveVideoAssetInput!): JSON

  """Verify uploaded bytes and attach them to the production. Editors only."""
  commitVideoAsset(input: CommitVideoAssetInput!): JSON

  """
  Publish the current production packet as an organization graph Document referencing its product and revision.
  """
  publishVideoProduction(input: PublishVideoProductionInput!): JSON

  """
  Regenerate the selected calendar week (at), or current week, as a registered task. Editors only.
  """
  generateProductReport(input: GenerateProductReportInput!): JSON

  """Enable or disable daily roadmap regeneration. Editors only."""
  changeProductReportSchedule(input: ChangeProductReportScheduleInput!): JSON

  """
  Add an issue (a stone, pebble or sand) to a project, last in its category. An assignee must be a current organization member. Any member of the installation.
  """
  createIssue(input: CreateIssueInput!): Issue!

  """
  Replace an issue's fields. Moving it to another project or category appends it there. A departed member stays assigned only while assigneeId is unchanged. Name the revision you read; a changed record is refused (409).
  """
  updateIssue(input: UpdateIssueInput!): Issue!

  """
  Delete an issue that has no sub-issues. Name the revision you read; a changed record is refused (409).
  """
  deleteIssue(input: DeleteIssueInput!): Deleted!

  """
  Set the order of one category of a project's issues: every issue of that category, each at its current revision, in the new order. Any change meanwhile is refused (409).
  """
  reorderIssues(input: ReorderIssuesInput!): Reordered!

  """
  Create a project with its name, GitHub repository link and documents (goals, user stories, press release, demo instructions and results, each Markdown of up to 16,000 characters), and optionally its requirements. Requirements start delivery preparation automatically; the answer says what changed and the preparation started. Any member of the installation.
  """
  createProject(input: CreateProjectInput!): Project!

  """
  Replace a project's name, repository and documents: a field left out is cleared, so send every document you read. Name the revision you read; a changed record is refused (409).
  """
  updateProject(input: UpdateProjectInput!): Project!

  """
  Overlay only mask fields on an existing Projects record. Read with includeIdentifiers:true first. Revision conflicts require a fresh read; omitted fields are preserved.
  """
  patchProject(input: PatchProjectInput!): Project!

  """
  Start delivery preparation again for a saved project revision whose dispatch failed or whose run failed. Uses the same preparation id, so it never duplicates work. Editors only.
  """
  prepareProject(input: PrepareProjectInput!): Project!

  """
  Submit a prepared Foundry package once, under requestId, at the digest you reviewed in ProjectDelivery. Requires an editor, a current unconflicted package, a ready implementation route and Governance approval of the package; without approval it asks for review and answers awaiting_review. Never merges, releases, publishes or manufactures.
  """
  submitDeliveryPackage(input: SubmitDeliveryPackageInput!): JSON

  """
  Save the complete organization project or product order at the revision read.
  """
  reorderPriority(input: ReorderPriorityInput!): JSON!

  """
  Save your personal organization or cross-organization project order at the revision read. Does not change shared priorities.
  """
  reorderPersonalPortfolio(input: ReorderPersonalPortfolioInput!): JSON!

  """
  Set the project lifecycle state at the revision read; archived projects can be restored.
  """
  setProjectState(input: SetProjectStateInput!): Project!

  """
  Archive a project at its current revision without deleting its issues or documents.
  """
  archiveProject(input: ArchiveProjectInput!): Project!

  """
  Delete a project that has no issues. Name the revision you read; a changed record is refused (409).
  """
  deleteProject(input: DeleteProjectInput!): Deleted!

  """
  Record current-release, deferred, needs-research or rejected with rationale, an optional existing project Release revision, and history. Current-release requires a Release; deferred without one stays in intake backlog. Optimistic revision and stable requestId required. Does not approve or start delivery. Editors only.
  """
  setIntakeReleaseFit(input: SetIntakeReleaseFitInput!): Intake!

  """
  Capture a customer or competitive intake under a stable requestId (replaying it returns the saved intake) and route it: the configured model proposes the child work, each route gated by the one active Governance control for its kind. When routing fails the intake is still saved, with routingError; routeIntake runs it later. Editors only.
  """
  createIntake(input: CreateIntakeInput!): Intake!

  """
  Route an intake whose work has not started, or set its canonical Planning project (required before implementation, changeable until implementation starts): with projectId alone the routes stay as they are; without a proposal the configured model proposes the child work; with one, those routes replace the current ones (implementation always waits for the selected discovery work). Name the intake revision you read. Editors only.
  """
  routeIntake(input: RouteIntakeInput!): Intake!

  """
  Claim a route's work for 15 minutes under a stable requestId and get its deterministic context. The caller must hold the perform (or recommend) duty of the route's control, the route's prerequisites must be approved, and nobody else may hold a live claim. Replaying the requestId renews the claim.
  """
  claimWork(input: ClaimWorkInput!): ClaimedWork!

  """
  Save a draft of a route's findings under a live claim (token) without requesting review. The draft may be incomplete; each save replaces the previous one, so an agent keeps adding sources and findings and then submits with recordResult. Returns { intakeId, revision, childId, savedAt }. The route's work record and its revision, which Governance reviews, do not change; the intake's revision does.
  """
  saveResultDraft(input: SaveResultDraftInput!): JSON

  """
  Submit research, architecture or prioritization findings under a live claim (token) and request the route's Governance review: pass result, or omit it to submit the draft saved with saveResultDraft; the previous result is kept in history. Architecture needs an approach; prioritization a disposition; an incomplete draft is refused (422). Without token and result, or with the same result again under the same token, it only asks the gate again to review the recorded result: any holder of the route's perform or recommend duty may, such as the Recommend holder after a perform-only worker recorded it. Provenance is agent-reported.
  """
  recordResult(input: RecordResultInput!): Intake!

  """
  Approve a changed title, description or sources under a stable requestId. Previous scope and results stay in history and every route gets a new identity, so earlier decisions cannot authorize the change; submitted delivery is frozen. Name the revision you read; a changed record is refused (409). Editors only.
  """
  reviseIntakeScope(input: ReviseIntakeScopeInput!): Intake!

  """
  Publish a route's recorded result to the Wiki as a proposed, agent-reported assertion on the intake's node, and return the Wiki record. Publishing again returns the existing record; a differing one is refused. Editors, or the route's assigned holder.
  """
  publishResult(input: PublishResultInput!): JSON

  """
  Submit a ready implementation route's work package to Foundry once, under work.requestId, with the preview and expectedDigest intakeWorkPreview returned and a selected Governance control; the delivery is recorded on the route. Editors only.
  """
  submitIntakeWork(input: SubmitIntakeWorkInput!): JSON

  """
  Reset an implementation submission Foundry rejected before creating a delivery record, so a corrected package can be submitted. Name the revision you read; a changed record is refused (409). Editors only.
  """
  resetIntakeSubmission(input: ResetIntakeSubmissionInput!): Intake!

  """
  Start one durable task that captures every active project's previous local day, then saves this owner's overview from those exact reports.
  """
  generateDailyReports(input: GenerateDailyReportsInput!): JSON!

  """
  Start the project-digest task for one project: the platform runs it durably and records its run; the digest appears in projectDigests when the run completes. Returns { id, task, created }: id is the run, read with digestRuns or the platform's TaskRuns. Editors only.
  """
  generateProjectDigest(input: GenerateProjectDigestInput!): JSON

  """
  Turn the morning digest of every active project on or off; it runs as the caller every day at 13:00 UTC. Editors only.
  """
  changeDigestSchedule(input: ChangeDigestScheduleInput!): DigestSchedule!

  """
  Link the pull requests merged into each project's repositories (its Wiki node's source_in edges) over the last days (default 7) to the project in the Wiki: one change batch of CodeChange records with merged_into and delivers relationships, each with its evidence and reason. Confident links commit by policy; the rest wait for review on the Wiki's Changes page. Returns { runId, batchId, state, pullRequests, proposals, skipped, unread }. Editors only.
  """
  linkProjectChanges(input: LinkProjectChangesInput!): JSON

  """
  Record every Measure in the Wiki for its last completed window (the previous week from Monday 00:00 UTC, or yesterday): run its connector operation (for example PostHog query.run, Grafana query.run or GitHub repositories.read) through the organization's connection and stage one Measurement per Measure, linked measurement_of its MetricDefinition and captured_with the Measure, in one change batch that commits by policy. A window already recorded is skipped; a failed read records nothing and is listed in unread. Returns { runId, batchId, state, measures, recorded, skipped, unread }. Editors only.
  """
  recordMeasurements(input: RecordMeasurementsInput!): JSON

  """
  File a feature or bug request with this organization as one of its design partners, from your own organization (graph_mutate with scope set to this organization and fromScope to yours). It waits as proposed until an editor here accepts or rejects it; replay the same requestId to read its status. Design partners only: other customers file an issue on the public repository.
  """
  submitPartnerRequest(input: SubmitPartnerRequestInput!): PartnerRequest!

  """
  Re-read this organization's design partners from its graph: customers whose customer_of link to it has design_partner set, each bound to a platform organization by organization_id. Only they can submit partner requests. Editors only.
  """
  refreshDesignPartners(input: JSON!): DesignPartners!

  """
  Accept a design partner's proposed request: if the graph still flags the partner, Software Foundry's RequestChanges files it as an issue in the repository or project you name, attributed to you, with the partner named in the problem and its product in the context. Name the revision you read; a changed record is refused (409). A refusal keeps it proposed. Editors only.
  """
  acceptPartnerRequest(input: AcceptPartnerRequestInput!): PartnerRequest!

  """
  Reject a design partner's proposed request with a reason the partner reads back. Nothing is filed. Name the revision you read; a changed record is refused (409). Editors only.
  """
  rejectPartnerRequest(input: RejectPartnerRequestInput!): PartnerRequest!

  """
  Create a use case in the Wiki for a project, or with id and revision replace one's title, summary, document and archived flag, and return the Wiki record. Editors only.
  """
  saveUseCase(input: SaveUseCaseInput!): JSON

  """
  Create, edit with a field mask (including requirements, repository links and the Onto Project node link), archive projects, or retry their delivery preparation
  """
  mutateProject(input: MutateProjectInput!): ChangeResults

  """Apply project changes using explicit actions"""
  projectChanges(input: ProjectChangesInput!): ChangeResults

  """Apply issue changes using explicit actions"""
  issueChanges(input: IssueChangesInput!): ChangeResults

  """Apply intake changes using explicit actions"""
  intakeChanges(input: IntakeChangesInput!): ChangeResults

  """Apply result changes using explicit actions"""
  resultChanges(input: ResultChangesInput!): ChangeResults

  """Apply usecase changes using explicit actions"""
  useCaseChanges(input: UseCaseChangesInput!): ChangeResults
}

