type Project {
  id: ID!
  name: String!
  archived: Boolean!
  rank: Int

  """Project lifecycle: draft, backlog, active, completed or archived."""
  state: String!
  slug: String
  useCases: [ProjectContextRecord!]!
  customerSegments: [ProjectContextRecord!]!
  userStoryRecords: [ProjectContextRecord!]!
  goalRecords: [ProjectContextRecord!]!
  readiness: ProjectReadiness!
  githubRepository: String

  """
  Repository publication status, receipt and retry instructions returned by patchProject.
  """
  repositoryChanges: JSON

  """
  Onto Project node link returned by patchProject: state (unchanged, linked or created), slug, or the error and retry instructions.
  """
  projectNodeChanges: JSON
  repositories(first: Int = 100, after: String, ids: [ID!]): ProjectRepositoryConnection!

  """What the project must achieve (Markdown)."""
  goals: String!

  """Who it serves and what they need (Markdown)."""
  userStories: String!

  """The draft press release announcing it (Markdown)."""
  pressRelease: String!

  """How to demonstrate it (Markdown)."""
  demoInstructions: String!

  """What the demonstration showed (Markdown)."""
  demoResults: String!

  """
  Rises with each change; updateProject and deleteProject name the revision read.
  """
  revision: Int!

  """
  Active and retired requirements with their stable keys, ids and revisions. Being listed does not mean approved, implemented or verified.
  """
  requirements: JSON!

  """
  On a write: which requirements were added, changed, retired, or only described differently (not actionable).
  """
  requirementChanges: JSON

  """
  The latest delivery preparation: state (queued, dispatched, dispatch_failed, running, prepared, blocked, superseded, failed), dispatchError, intake, packages, questions, conflicts and blockers.
  """
  preparation: JSON

  """
  On a write that started preparation: its task run (id, status); read it with TaskRuns.
  """
  run: JSON

  """On a write: required next steps, such as retrying a failed dispatch."""
  instructions: JSON

  """Issues in todo or in-progress."""
  openIssues: Int!
  updatedAt: DateTime!
}

