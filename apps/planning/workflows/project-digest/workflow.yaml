version: beta
id: project-digest
summary: Each morning, summarize what changed in every Planning project since its last daily digest, so the team sees what shipped and what is now prioritized.
actors: {}
# "Generate digest now" starts one project's digest as a registered task: the
# platform owns the run, its durable dispatch, recovery and failure record.
task:
  input: summarize.inputs.request
  output: summarize.outputs.digests
  schema:
    type: object
    properties:
      projectId: {type: string, format: uuid}
    required: [projectId]
    additionalProperties: false
triggers:
  - on: manual
  # An editor turns the schedule on from a project's Daily digest page; it then
  # runs unattended as them every morning (13:00 UTC) across the installation.
  - on: schedule
    cron: "0 13 * * *"
steps:
  # No actor fills this step: Planning does, through the workflow host. It diffs
  # each project against the snapshot its previous digest kept, asks the
  # platform's inference (inference.generate) for a short narrative, keeps the
  # digest in its own database and reports the counts with workflow.collect.
  - id: summarize
    inference: {maxOutputTokens: 1500}
    inputs:
      # A task's {projectId}; the morning run leaves it empty and covers every active project.
      request:
        schema: {type: object}
        default: {}
    outputs:
      digests:
        connector: database
        record: digests.written
        schema:
          type: object
          properties:
            written:
              type: integer
              minimum: 0
              description: Digests saved
            unchanged:
              type: integer
              minimum: 0
              description: Projects with nothing new since their last digest
            digestIds:
              type: array
              items: {type: string}
              description: The digests saved, in Planning
          required: [written, unchanged]
          additionalProperties: false
outputs:
  digests: summarize.outputs.digests
