type Query {
  dailyAppUpdates(first: Int = 100, after: String, ids: [ID!], date: String!): AppDailyUpdateConnection!

  """
  Read a generated document series. Defaults to its greatest version (lexical order) and that document's current draft revision. Supply version and revision to pin both.
  """
  documentVersion(key: String!, version: String, revision: Int): WikiDocumentVersion
  searchDocuments(refs: [String!], search: [String!], revision: Int, after: String, first: Int = 20, includeBody: Boolean = false): WikiSearchResults
  documents(after: ID, first: Int): [WikiDocument]
  document(id: ID!, revision: Int): WikiDocument
  documentRevisions(id: ID!, before: Int): [DocumentRevision]
  pages: [WikiPage]
  page(slug: String!): WikiPage
}

type AppDailyUpdateConnection {
  edges: [AppDailyUpdateConnectionEdge!]!
  nodes: [AppDailyUpdate!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AppDailyUpdateConnectionEdge {
  cursor: String!
  node: AppDailyUpdate!
}

type AppDailyUpdate {
  id: ID
  slug: String
  app: String
  summary: String
  complete: Boolean
  revision: Int
  timezone: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type WikiDocumentVersion {
  documentId: ID
  revision: Int
  slug: String
  version: String
  title: String
  body: String
  generatedBody: String
  timezone: String
  status: String
  savedAt: String
}

type WikiSearchResults {
  documents: [WikiSearchHit]
  next: String
}

type WikiSearchHit {
  slug: String
  id: ID
  revision: Int
  publishedRevision: Int
  title: String
  summary: String
  body: String
  generatedBody: String
}

type WikiDocument {
  slug: String
  documentId: ID
  revision: Int
  title: String
  summary: String
  body: String
  generatedBody: String
  provenance: String
  editorId: String
  createdAt: String
  id: ID
  installationId: ID
  publishedRevision: Int
  archived: Boolean
}

type DocumentRevision {
  documentId: ID
  revision: Int
  title: String
  summary: String
  body: String
  generatedBody: String
  provenance: String
  editorId: String
  createdAt: String
}

type WikiPage {
  id: ID
  slug: String
  documentId: ID
  document(revision: Int): WikiDocument
  entityRef: String
  parentId: ID
  revision: Int
  autoPublish: Boolean
  policyRef: String
}

type Mutation {
  """
  Revise only the generated draft section while preserving authored and published content.
  """
  saveGeneratedDocument(input: SaveGeneratedDocumentInput!): WikiDocument

  """Save a revisioned draft without publishing it."""
  saveDocument(input: SaveDocumentInput!): WikiDocument

  """Create or configure a Wiki page."""
  savePage(input: SavePageInput!): WikiPage

  """Publish a revision after its policy requirements pass."""
  publishDocument(input: PublishDocumentInput!): WikiDocument

  """Archive a document without deleting its history."""
  archiveDocument(input: ArchiveDocumentInput!): WikiDocument
}

input SaveGeneratedDocumentInput {
  id: String
  revision: Float
  slug: String
  title: String
  generatedBody: String!
  provenance: JSON!
}

"""Any JSON value."""
scalar JSON

input SaveDocumentInput {
  id: String
  revision: Float
  title: String!
  summary: String
  body: String
  slug: String
}

input SavePageInput {
  id: String
  revision: Float
  slug: String!
  documentId: String
  entityRef: SavePageInputEntityRef
  parentId: String
  autoPublish: Boolean
  policyRef: SavePageInputPolicyRef
}

input SavePageInputEntityRef {
  installationId: String!
  type: String!
  id: String!
}

input SavePageInputPolicyRef {
  installationId: String!
  type: String!
  id: String!
}

input PublishDocumentInput {
  id: String!
  revision: Float!
}

input ArchiveDocumentInput {
  id: String!
  revision: Float!
}
