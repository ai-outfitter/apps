type Mutation {
  """Request a project workspace build and preserve revision provenance."""
  requestWorkshopBuild(input: RequestWorkshopBuildInput!): JSON

  """Claim a project workspace build and preserve revision provenance."""
  claimWorkshopBuild(input: ClaimWorkshopBuildInput!): JSON

  """Finish a project workspace build and preserve revision provenance."""
  finishWorkshopBuild(input: FinishWorkshopBuildInput!): JSON

  """
  Start Workshop's design agent on a part or project request without waiting for the model: a new project from `message`, or a follow-up to `projectId` at the `revision` the caller saw (a stale revision is refused before anything starts). The work runs as a workshop-design task run; an organization owner or admin may start it. Answers the run { id, status, design, created }: read WorkshopDesignRun with that id until status is complete (design names the saved projectId and revision) or failed. Pass `id` to make a retry start nothing twice.
  """
  startWorkshopDesign(input: StartWorkshopDesignInput!): JSON

  """
  Start a project from a starter example (cube, holder, button, node or sensor) as the Workshop page's New project does, within the installation's cap of 100 projects, named and linked to the Wiki ProductRevision it builds when given. Answers the project as the list shows it; a member refines it on the page.
  """
  createWorkshopProject(input: CreateWorkshopProjectInput!): WorkshopProject!

  """
  Link a project to the Wiki ProductRevision it builds (its record id, Wiki installation, title and link), or unlink it with null, at the revision the caller saw; a stale revision is refused. Answers the project at its next revision.
  """
  nameWorkshopProductRevision(input: NameWorkshopProductRevisionInput!): WorkshopProject!

  """
  Set a project's name, stage (concept, prototyping, validation, pilot, manufacturing), brief or requirements at the revision the caller saw; a field left out keeps its value and a stale revision is refused. Answers the project at its next revision.
  """
  describeWorkshopProject(input: DescribeWorkshopProjectInput!): WorkshopProject!

  """
  Replace a project's product structure at the revision the caller saw: its items (assemblies, printed parts, COTS parts, PCBs and firmware, each with a part number and revision letter) and the usage lines from each assembly to the items it contains, with quantities, reference designators and placements; the BOM, costs and 3D view derive from it. Item geometry is a CAD plan (JSON) and a placement is [x, y, z] in mm. A stale revision is refused. Answers the project at its next revision.
  """
  saveWorkshopAssembly(input: SaveWorkshopAssemblyInput!): WorkshopProject!

  """
  Delete a project at the revision the caller saw; a stale revision is refused. Answers the deleted id.
  """
  deleteWorkshopProject(input: DeleteWorkshopProjectInput!): ID!

  """
  Remove a design concept mockup and its image from a project at the revision the caller saw; a stale revision is refused. Answers the project as the list shows it, at its next revision.
  """
  removeWorkshopConcept(input: RemoveWorkshopConceptInput!): WorkshopProject!

  """
  Publish a project's design concepts to the owner's Wiki as one Document that is evidence_for the named ProductRevision, written as the caller; the same project revision publishes the same Document again. Answers { documentId, url }.
  """
  publishWorkshopConcepts(input: PublishWorkshopConceptsInput!): JSON

  """
  Add one physical unit to the inventory by part number with its MAC address (any common spelling) or serial number, its status (in-stock, allocated, installed, retired), location, project and firmware, within the cap of 1000 units; a MAC already recorded is refused. Answers the unit.
  """
  recordWorkshopUnit(input: RecordWorkshopUnitInput!): WorkshopUnit!

  """
  Replace a unit's fields (after flashing, installing or moving it) at the revision the caller saw; a stale revision is refused. Answers the unit at its next revision.
  """
  updateWorkshopUnit(input: UpdateWorkshopUnitInput!): WorkshopUnit!

  """
  Remove a unit from the inventory at the revision the caller saw; a stale revision is refused. Answers the deleted id.
  """
  deleteWorkshopUnit(input: DeleteWorkshopUnitInput!): ID!

  """Apply project changes using explicit actions"""
  projectChanges(input: ProjectChangesInput!): ChangeResults

  """Apply unit changes using explicit actions"""
  unitChanges(input: UnitChangesInput!): ChangeResults

  """Apply concept changes using explicit actions"""
  conceptChanges(input: ConceptChangesInput!): ChangeResults

  """Apply assembly changes using explicit actions"""
  assemblyChanges(input: AssemblyChangesInput!): ChangeResults

  """Apply productrevision changes using explicit actions"""
  productRevisionChanges(input: ProductRevisionChangesInput!): ChangeResults
}

type ChangeResults {
  items: [ChangeReceipt!]!
  instructions: [ChangeInstruction!]!
}

type ChangeReceipt {
  key: String!
  status: String!
  result: JSON
  error: JSON
}

type ChangeInstruction {
  code: String!
  itemKey: String!
  actor: String!
  required: Boolean!
  message: String!
  call: JSON
  taskId: String
  url: String
}

