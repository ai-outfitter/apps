type Query {
  workshopProjects(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
    createdBy: [ID!]
    productRevisionId: [ID!]
  ): WorkshopProjectConnection!
  workshopUnits(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
    partNumber: [String!]
    mac: [String!]
    status: [String!]
    projectId: [ID!]
  ): WorkshopUnitConnection!

  """
  Read one project as persisted: name, revision, stage, brief, requirements, the product revision it builds and its whole assembly (items and usage lines). A proposed assembly is not evidence of purchased parts, CAD, fabrication or fit. Changes nothing.
  """
  workshopProjectHandoff(input: WorkshopProjectHandoffInput!): JSON!

  """
  Read one design run by the id StartWorkshopDesign answered: status (running, complete or failed) and, once complete, design { projectId, revision, name, features, size [x, y, z] mm, prompt }. A failed run saved nothing; the platform's TaskRuns holds its reason. Changes nothing.
  """
  workshopDesignRun(input: WorkshopDesignRunInput!): JSON!
}

