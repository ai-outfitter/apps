"""How WorkshopProject records are ordered, ties by ID."""
enum WorkshopProjectOrder {
  ID_ASC
  ID_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
}

input WorkshopProjectFilter {
  createdBy: IDFilter
  productRevisionId: IDFilter
  and: [WorkshopProjectFilter!]
  or: [WorkshopProjectFilter!]
  not: WorkshopProjectFilter
}

"""
Conditions on one id field of a filter; every one given must hold, and a filter holds at most 20. They run in the database.
"""
input IDFilter {
  isNull: Boolean
  equalTo: ID
  notEqualTo: ID
  in: [ID!]
  notIn: [ID!]
  lessThan: ID
  lessThanOrEqualTo: ID
  greaterThan: ID
  greaterThanOrEqualTo: ID
}

