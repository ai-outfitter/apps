type WorkConnection {
  nodes: [Work!]!
  pageInfo: PageInfo!
  aggregate: Aggregate!
}

type Work {
  key: ID!
  requestId: String!
  repository: String!
  issue: JSON
  createdAt: DateTime!
}

"""Any JSON value."""
scalar JSON

"""ISO-8601 date or date-time; as input also "NOW"."""
scalar DateTime

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Aggregate {
  count: Int!
}

type FoundryProjectConnection {
  nodes: [FoundryProject!]!
  pageInfo: PageInfo!
  aggregate: Aggregate!
}

type FoundryProject {
  id: ID!
  name: String!
  position: Float!
  repositories: JSON!
  milestones: JSON!
  revision: Float!
  updatedAt: DateTime!
}

type ChangeList {
  """Newest merge first."""
  changes: [Change!]!

  """
  Repositories GitHub did not answer in full; their changes may be missing or partial.
  """
  failed: [String!]!

  """
  False when a repository had more than 250 merges in the window; narrow it.
  """
  complete: Boolean!
}

"""One pull request merged into a repository."""
type Change {
  repository: String!
  number: Int!
  title: String!
  url: String!
  mergedAt: DateTime!

  """GitHub login; null for a deleted account."""
  author: String

  """The commit the merge put on the base branch."""
  mergeCommit: String

  """
  feature, fix or maintenance from a Conventional Commits title prefix (feat:, fix:, or build, chore, ci, deps, docs, perf, refactor, revert, style, test); null otherwise, so classify it yourself.
  """
  kind: String

  """
  Parts of the repository the change touched: each file's first directory, or for a file under apps/ or packages/, that package (catalog/apps/crm). "." is the root. Read from the first 100 files.
  """
  areas: [String!]!
}

input SubmitReleaseEvidenceInput {
  bundle: String!
  assets: [SubmitReleaseEvidenceInputAssetsItem!]!
}

input SubmitReleaseEvidenceInputAssetsItem {
  path: String!
  contentType: String!
  sha256: String!
  visibility: SubmitReleaseEvidenceInputAssetsItemVisibility
  size: Int!
  key: ID!
}

enum SubmitReleaseEvidenceInputAssetsItemVisibility {
  organization
  public
}

"""The request's GitHub issue and the Foundry run working it."""
type SubmittedRequest {
  id: ID!
  kind: String!

  """Read it back with work.get."""
  submissionId: ID!
  repository: String!
  issue: SubmittedIssue!
  run: WorkRun
  execution: WorkExecution
}

type SubmittedIssue {
  number: Int!
  url: String!

  """
  False when a retry found the issue (or comment) an earlier attempt wrote, or an existing issue was attached.
  """
  created: Boolean!
}

"""
The issue's Foundry run; `existing` when it was already running or recorded, so nothing was restarted.
"""
type WorkRun {
  id: ID!
  workflow: String!
  existing: Boolean!
  status: String!
  url: String!
}

"""
Why no run is reported although the issue is recorded: execution is blocked, or its outcome is unknown and must be reconciled.
"""
type WorkExecution {
  status: String!
  message: String!
}

input SubmitRequestInput {
  requestId: ID!
  kind: SubmitRequestInputKind!
  title: String!
  problem: String!
  acceptanceCriteria: [SubmitRequestInputAcceptanceCriteriaItem!]!
  bug: SubmitRequestInputBug
  target: SubmitRequestInputTarget!
  context: [SubmitRequestInputContextItem!]
}

enum SubmitRequestInputKind {
  feature
  bug
}

input SubmitRequestInputAcceptanceCriteriaItem {
  id: String!
  text: String!
}

input SubmitRequestInputBug {
  stepsToReproduce: [String!]!
  expected: String!
  actual: String!
  environment: String
}

input SubmitRequestInputTarget {
  repository: String
  project: String
}

input SubmitRequestInputContextItem {
  installationId: String!
  type: String!
  id: String!
  title: String
}

"""The request and the run now working it."""
type ResumedRequest {
  id: ID!
  run: ResumedRun!
}

type ResumedRun {
  id: ID!
  existing: Boolean!
  status: String!
}

input ResumeRequestInput {
  requestId: ID!
  resumeId: ID!
}

"""The repository's Foundry subscription."""
type EnabledRepository {
  repository: String!
  subscriptionId: ID!
  workflow: String!
}

input EnableRepositoryInput {
  repository: String!
  reviewer: String
}

input CreateProjectInput {
  name: String!
  repositories: [String!]
}

type Query {
  work(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
    repository: [String!]
    requestId: [String!]
  ): WorkConnection!
  foundryProjects(
    first: Int = 100
    after: String
    ids: [ID!]

    """Match text across this collection’s text fields."""
    search: String
  ): FoundryProjectConnection!

  """
  Pull requests merged at or after `since` and before `until` (default now; both ISO-8601 with an offset), at most 31 days apart, across `repositories` (owner/name) or, by default, every repository your GitHub connection may read.
  """
  changes(since: DateTime!, until: DateTime, repositories: [String!]): ChangeList!

  """Read your feature and bug requests with their GitHub issues."""
  requests(input: RequestsInput!): JSON
}

input RequestsInput {
  ids: [ID!]
  search: String
  first: Int
  after: String
}

type Mutation {
  """
  Reserve expiring authenticated PUT links for immutable release evidence assets. Uploads verify size, digest and file type. Repeat the same keys to read completion receipts. This never approves or deploys a release.
  """
  submitReleaseEvidence(input: SubmitReleaseEvidenceInput!): JSON

  """
  File a feature or bug request against a repository or Foundry project: kind, title, problem, acceptance criteria with ids, and for bugs steps to reproduce, expected and actual. Validated strictly against the work-request schema. Foundry opens the GitHub issue and starts its workflow, which triages, implements, reviews and merges. If execution is unavailable, returns the issue with run: null and execution details; the request is still recorded. Retry with the same requestId; changed content conflicts. Needs editor access.
  """
  submitRequest(input: SubmitRequestInput!): SubmittedRequest!

  """
  Start a request's stopped Foundry run again (it failed or awaits details), on the same open issue. A running run is returned, not restarted. Needs editor access.
  """
  resumeRequest(input: ResumeRequestInput!): ResumedRequest!

  """
  Turn Foundry execution on for a repository this organization's GitHub connection reaches: approve its role agents and subscribe to its issues, so requests filed there start Foundry's issue-to-merge workflow. Repeat after a Foundry change to refresh. Owners and admins only.
  """
  enableRepository(input: EnableRepositoryInput!): EnabledRepository!

  """
  Add a Foundry project: a named group of repositories work can be routed to, at the lowest priority. Names are upper case and unique; repositories lower case, once each. Owners and admins only.
  """
  createProject(input: CreateProjectInput!): FoundryProject!

  """
  File feature and bug requests: each opens a GitHub issue and starts Foundry's workflow
  """
  requestChanges(input: RequestChangesInput!): ChangeResults

  """Turn Foundry execution on for a repository"""
  repositoryChanges(input: RepositoryChangesInput!): ChangeResults

  """Apply project changes using explicit actions"""
  projectChanges(input: ProjectChangesInput!): ChangeResults
}

type ChangeResults {
  items: [ChangeReceipt!]!
  instructions: [ChangeInstruction!]!
}

type ChangeReceipt {
  key: String!
  status: String!
  result: JSON
  error: JSON
}

type ChangeInstruction {
  code: String!
  itemKey: String!
  actor: String!
  required: Boolean!
  message: String!
  call: JSON
  taskId: String
  url: String
}

input RequestChangesInput {
  items: [RequestChangesInputItemsItem!]!
}

input RequestChangesInputItemsItem {
  key: String!
  action: RequestChangesInputItemsItemAction!
  input: JSON!
}

enum RequestChangesInputItemsItemAction {
  submit
  resume
}

input RepositoryChangesInput {
  items: [RepositoryChangesInputItemsItem!]!
}

input RepositoryChangesInputItemsItem {
  key: String!
  action: RepositoryChangesInputItemsItemAction!
  input: JSON!
}

enum RepositoryChangesInputItemsItemAction {
  enable
}

input ProjectChangesInput {
  items: [ProjectChangesInputItemsItem!]!
}

input ProjectChangesInputItemsItem {
  key: String!
  action: ProjectChangesInputItemsItemAction!
  input: JSON!
}

enum ProjectChangesInputItemsItemAction {
  createProject
}
