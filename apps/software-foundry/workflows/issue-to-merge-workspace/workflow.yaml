version: beta
id: issue-to-merge-workspace
summary:
  Take a GitHub issue through isolated Outfitter workspaces, validation, independent formal
  review, one repair pass, and protected merge.
actors:
  triager:
    kind: external
    binding: triage.inputs.triagerBinding
  engineer:
    kind: external
    binding: triage.inputs.engineerBinding
  validator:
    kind: external
    binding: triage.inputs.validatorBinding
  reviewer:
    kind: external
    binding: triage.inputs.reviewerBinding
  repairer:
    kind: external
    binding: triage.inputs.repairerBinding
  lander:
    kind: external
    binding: triage.inputs.landerBinding
triggers:
  - on: manual
  - on: event
    type: github.issue
    match:
      action: opened
    input: triage.inputs.event
  - on: event
    type: github.merge-group
    match:
      action: checks_requested
    input: triage.inputs.event
steps:
  - id: triage
    actor: triager
    inputs:
      event:
        schema:
          type: object
          required:
            - repository
          properties:
            repository:
              type: object
            issue:
              type: object
            merge_group:
              type: object
      triagerBinding:
        schema:
          type: string
          minLength: 1
      engineerBinding:
        schema:
          type: string
          minLength: 1
      validatorBinding:
        schema:
          type: string
          minLength: 1
      reviewerBinding:
        schema:
          type: string
          minLength: 1
      repairerBinding:
        schema:
          type: string
          minLength: 1
      landerBinding:
        schema:
          type: string
          minLength: 1
      checkerBinding:
        schema:
          type: string
          minLength: 1
    instructions:
      Read the assigned GitHub issue with gh, inspect a shallow checkout, and establish a
      concrete implementation plan and relevant checks. Return result with ready true and summary
      containing the plan, or ready false and summary containing one focused clarification question.
      Do not publish comments or implement code; the coordinator publishes the result.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
  - id: implement
    actor: engineer
    inputs:
      event: triage.inputs.event
      previous: triage.outputs.result
    instructions:
      "Implement only the accepted plan in a fresh checkout. Create branch
      outfitter/issue-<issue number>-<assigned runId>. Follow repository instructions and its
      lockfile, run targeted checks, capture desktop/mobile screenshots for visual changes and
      commit the evidence. Commit, push this branch and open one draft PR with a native Closes
      #<issue number> link. Use gh pr create --body-file. Return a copy of previous with candidate
      {number,headSha,url,branch}, using actual gh pr view results. Never merge or publish a
      review."
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: validate
    actor: validator
    inputs:
      event: triage.inputs.event
      previous: implement.outputs.result
    instructions:
      Run the approved deterministic validation commands at the candidate commit. Return the
      verified check receipts with the preceding state.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: review
    actor: reviewer
    inputs:
      event: triage.inputs.event
      previous: validate.outputs.result
    instructions:
      In a clean checkout, inspect the candidate exact commit, issue, plan, all relevant
      changed source, validation results and actual screenshots. Independently run relevant checks.
      Do not edit or push implementation code. Return result containing ready true, verdict approved
      or changes-requested, and summary with concrete actionable defects or the evidence supporting
      approval and limitations. A failed check requires changes-requested. The coordinator publishes
      your formal GitHub review under the separate configured reviewer identity.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: repair
    actor: repairer
    inputs:
      event: triage.inputs.event
      previous: review.outputs.result
    instructions:
      If previous.passed is true and previous.review.verdict is approved, return previous
      unchanged. Otherwise inspect the validation failures and formal review, perform one bounded
      repair pass on the existing candidate branch/PR, run targeted checks, update any screenshots,
      commit and push. Return a copy of previous with candidate {number,headSha,url,branch} from
      actual gh pr view. Do not publish a review or merge. If blocked, explain the concrete blocker
      rather than inventing completion.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: validate-final
    actor: validator
    inputs:
      event: triage.inputs.event
      previous: repair.outputs.result
    instructions:
      Run the approved deterministic validation commands at the candidate commit. Return the
      verified check receipts with the preceding state.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: review-final
    actor: reviewer
    inputs:
      event: triage.inputs.event
      previous: validate-final.outputs.result
    instructions:
      In a clean checkout, inspect the candidate exact commit, issue, plan, all relevant
      changed source, validation results and actual screenshots. Independently run relevant checks.
      Do not edit or push implementation code. Return result containing ready true, verdict approved
      or changes-requested, and summary with concrete actionable defects or the evidence supporting
      approval and limitations. A failed check requires changes-requested. The coordinator publishes
      your formal GitHub review under the separate configured reviewer identity.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: land
    actor: lander
    inputs:
      event: triage.inputs.event
      previous: review-final.outputs.result
    instructions:
      Return the preceding state unchanged. The trusted coordinator verifies current formal
      approval and checks before performing the protected merge; the agent must never invoke merge
      or change repository policy.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
outputs:
  triage: triage.outputs.result
  delivery: land.outputs.result
$defs:
  state:
    type: object
    required:
      - ready
      - summary
    properties:
      ready:
        type: boolean
      summary:
        type: string
        minLength: 1
      candidate:
        type: object
      checks:
        type: array
      review:
        type:
          - object
          - "null"
      merge:
        type: object
      verdict:
        enum:
          - approved
          - changes-requested
    additionalProperties: true
