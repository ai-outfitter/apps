version: beta
id: foundry-request-intake
summary: Triage a submitted feature or bug request and save a reviewable intake result.
actors: {}
task:
  input: triage.inputs.request
  output: triage.outputs.result
  schema:
    type: object
    properties:
      requestId: {type: string, format: uuid}
    required: [requestId]
    additionalProperties: false
triggers:
  - on: manual
steps:
  - id: triage
    inference: {maxOutputTokens: 2500, timeoutMs: 90000}
    inputs:
      request:
        schema: {type: object}
        default: {}
    outputs:
      result:
        connector: database
        record: request.triaged
        schema: {type: object}
outputs:
  result: triage.outputs.result
