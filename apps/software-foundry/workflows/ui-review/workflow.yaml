version: beta
id: ui-review
summary: Review a product's pages at phone and desktop size against Outfitter's UI standards and file one remediation issue per fix; on an enabled repository each issue becomes a pull request whose Demo is its before-and-after evidence.
actors:
  reviewer:
    kind: external
    binding: analyze.inputs.reviewerBinding
triggers:
  - on: manual
  - on: schedule
    cron: "0 14 * * 3"
$defs:
  createdIssue:
    type: object
    required: [number, url, title]
    properties:
      number: {type: integer}
      url: {type: string, format: uri}
      title: {type: string}
      fixRun: {type: string}
steps:
  - id: analyze
    actor: reviewer
    inputs:
      reviewerBinding:
        schema: {type: string, minLength: 1}
      fix:
        schema:
          type: object
          required: [installation, resource, inputs]
          properties:
            installation: {type: string, minLength: 1}
            resource: {type: string, minLength: 1}
            inputs: {type: object, additionalProperties: {type: string}}
      repository:
        schema: {type: string, pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"}
    instructions: |-
      Review the user interface this repository ships, page by page, the way a demanding product designer would, and file the fixes worth making.

      Review ONE app per run, thoroughly, rather than skimming many. Work from a checkout in persistent workspace files and read the README and AGENTS.md. List the repository's apps (for Outfitter repositories, each directory under `apps/` with an `app.json` and pages under `src/pages`), sorted by name, and pick the one at index (ISO week number from `date +%V`) modulo the number of apps. If the repository has a single product, review that. Say which app you picked and why in your final message.

      Show every page of that app with demo data, never the operational dev server (it has no platform and shows Unauthorized). For an Outfitter app: run `npm ci` and `npm run build:sdk` at the root, run the app's `pretest:e2e` script (or `node --import tsx scripts/prepare-tests.ts` in its directory) to build its demo package, then copy the app's existing navigation or demo browser spec into a new spec file in the app's `tests/` directory (it uses `appWorker`, `appArtifact(new URL("..", import.meta.url), "demo")` and `routeReadOnly` from `@ai-outfitter/app-test`). In that one spec, loop over every route of the app (fill dynamic segments such as `[id]` from links on the list pages) and save a full-page PNG of each at 1440x1000 and at 390x844, plus one phone shot with the navigation drawer open, into /workspace/files/ui-review. Run it with `npx playwright test <spec> --workers 1` from the app directory, fix the spec until every route is captured, and delete the spec afterwards. Other products: use their documented demo build, test server or read-only preview URL, never real credentials. You may install dependencies, but never commit, push or change the repository.

      Open and look at every screenshot you saved before judging; a finding must come from a screenshot, not only from reading CSS. In the same spec, also record for each phone page whether `document.documentElement.scrollWidth` exceeds the viewport and which tap targets are under 40px. A page that still shows Unauthorized, an error or an empty shell is unreviewable: list it, do not judge it.

      Judge against these standards, in this order:
      1. Phone layout works: no horizontal scroll, nothing clipped or overlapping, the navigation reachable, primary content in the first screen.
      2. Muted and quiet: neutral colors, color only for meaning, no decorative gradients, shadows or badges.
      3. Hairlines, not boxes: sections separated by thin rules and spacing; never a card inside a card or a panel inside a panel.
      4. Links over buttons: navigation and secondary actions are text links; a button only for the one primary action of a form or page.
      5. Cut copy: no explanatory paragraphs restating the heading, no instructions the layout already makes obvious, no marketing tone; labels short and plain.
      6. No timestamps or counts as decoration: no "updated 3 minutes ago", record counts or badges with numbers unless the page is about that number.
      7. No backlink breadcrumbs ("Back to ...") and no demo or preview banners.
      8. Consistency: the same thing looks and is named the same on every page, using the shared UI kit and app shell rather than local one-off styles.

      Each issue you file starts an agent that opens one pull request and merges it once checks pass, so file at most 3 issues, most valuable first, titled `UI: <app>: <problem>`. Each issue is one fix that one engineer can finish in a single small pull request: one page, or one shared component or style when the same problem repeats across pages (say so, and list the pages). Group trivial copy cuts on one page into one issue. Each issue body states:
      - the pages (route) and viewports affected and what is wrong, specifically;
      - the cause, with file paths and the CSS rule or markup responsible;
      - the fix, and the standard it applies;
      - how to capture it: the exact recipe you used, written so the engineer can repeat it in a few minutes: the setup commands, the temporary spec (which existing spec to copy, `appWorker`, `appArtifact(new URL("..", import.meta.url), "demo")`, `routeReadOnly`) narrowed to only the affected routes, and `npx playwright test <spec> --workers 1` from the app directory. Say to capture the before shots first, in the same checkout before editing anything, and the after shots there once the fix is in (never a second checkout or a second `npm ci`: the workspace runs out of room), saving `<page>-before-desktop.png`, `<page>-before-mobile.png`, `<page>-after-desktop.png` and `<page>-after-mobile.png` outside Git, then delete the spec. Say not to run the app's whole browser suite for this: it is slow and its unrelated failures are not this issue's;
      - acceptance criteria, including this one verbatim: "Evidence: the pull request's Demo shows a before (main) and after (this branch) screenshot of every affected page at 1440x1000 and 390x844, captured the same way, and the reviewer requests changes if any pair is missing."
      Do not file an issue that duplicates an open issue in the repository, a matter of taste you cannot tie to a standard above, or anything you could not see in a screenshot. Filing no issues is a valid result.

      In your final message name the app you reviewed and list every page you looked at with the viewports you captured, the pages you could not open and why, and the findings you saw but did not file.
    outputs:
      issues:
        schema:
          type: object
          required: [repository, issues]
          properties:
            repository: {type: string}
            issues: {type: array, maxItems: 3, items: {$ref: "#/$defs/createdIssue"}}
            retried: {type: array, items: {$ref: "#/$defs/createdIssue"}}
            closed: {type: array, items: {$ref: "#/$defs/createdIssue"}}
            summary: {type: string}
outputs:
  issues: analyze.outputs.issues
