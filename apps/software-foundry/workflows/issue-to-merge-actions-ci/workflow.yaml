version: beta
id: issue-to-merge-actions-ci
summary:
  Take a GitHub issue through isolated Outfitter workspaces, GitHub Actions CI, independent formal
  review, one repair pass, and protected merge.
actors:
  triager:
    kind: external
    binding: triage.inputs.triagerBinding
  engineer:
    kind: external
    binding: triage.inputs.engineerBinding
  validator:
    kind: external
    binding: triage.inputs.validatorBinding
  reviewer:
    kind: external
    binding: triage.inputs.reviewerBinding
  repairer:
    kind: external
    binding: triage.inputs.repairerBinding
  lander:
    kind: external
    binding: triage.inputs.landerBinding
triggers:
  - on: manual
  - on: event
    type: github.issue
    match:
      action: opened
    input: triage.inputs.event
steps:
  - id: triage
    actor: triager
    inputs:
      event:
        schema:
          type: object
          required:
            - repository
          properties:
            repository:
              type: object
            issue:
              type: object
      triagerBinding:
        schema:
          type: string
          minLength: 1
      engineerBinding:
        schema:
          type: string
          minLength: 1
      validatorBinding:
        schema:
          type: string
          minLength: 1
      reviewerBinding:
        schema:
          type: string
          minLength: 1
      repairerBinding:
        schema:
          type: string
          minLength: 1
      landerBinding:
        schema:
          type: string
          minLength: 1
    instructions:
      Read the assigned GitHub issue with gh, inspect a shallow checkout, and establish a
      concrete implementation plan and relevant checks. Keep the plan in workflow outputs,
      never in committed Markdown plans or issue copies. Return result with ready true and summary
      containing the plan, or ready false and summary containing one focused clarification question.
      Do not publish comments or implement code; the coordinator publishes the result.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
  - id: implement
    actor: engineer
    inputs:
      event: triage.inputs.event
      previous: triage.outputs.result
    instructions:
      "Implement only the accepted plan in a fresh checkout. Create branch
      outfitter/issue-<issue number>-<event.sourceRunId if present, otherwise assigned runId>.
      On an explicit resume, fetch and reuse that existing branch and its open PR and push only
      necessary changes; never create a duplicate PR for it. Follow repository instructions and its
      lockfile and run the plan's targeted checks. Commit code only (never plans, issue notes or
      screenshots), push the branch and open one draft PR with gh pr create --body-file and a native
      Closes #<issue number> link. Return a copy of previous with candidate {number,headSha,url,branch}
      from gh pr view. Never merge or publish a review. Missing screenshots are recorded for review,
      not a failure of this step."
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: validate
    actor: validator
    inputs:
      event: triage.inputs.event
      previous: implement.outputs.result
    instructions:
      The trusted coordinator waits for GitHub Actions checks and PR previews at the candidate
      commit. No validation workspace or agent is dispatched. Return verified CI receipts.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: review
    actor: reviewer
    inputs:
      event: triage.inputs.event
      previous: validate.outputs.result
    instructions:
      In a clean checkout, inspect the candidate exact commit, issue, plan, all relevant
      changed source, GitHub Actions logs, screenshots displayed in the PR Demo,
      and the published PR preview. Build required targets before direct integration tests.
      Use the preview URLs in previous.previews and verify its revision; independently run targeted checks.
      Inspect previous.demo for screenshot gaps and previous.evidence for publisher-recorded
      receipts. Assess missing screenshots explicitly; request changes when they prevent adequate
      review. Do not edit or push implementation code. Return result containing ready true, verdict approved
      or changes-requested, and summary with concrete actionable defects or the evidence supporting
      approval and limitations. A failed check requires changes-requested. The coordinator publishes
      your formal GitHub review under the separate configured reviewer identity (Vega for this
      rollout), then reads it back. Review completion requires that published review, not just
      your local verdict or a comment.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: repair
    actor: repairer
    inputs:
      event: triage.inputs.event
      previous: review.outputs.result
    instructions:
      Address validation failures or review findings only. If validation and independent approval
      pass for the unchanged candidate commit, the coordinator records repair as skipped without
      dispatching an agent. Otherwise inspect the validation failures and formal review, perform one bounded
      repair pass on the existing candidate branch/PR, run targeted checks, commit and push code only, then upload changed screenshots to
      the Foundry run's storage at the new source commit and update the PR Demo URLs. Return a copy of previous with candidate {number,headSha,url,branch} from
      actual gh pr view. Do not publish a review or merge. If blocked, explain the concrete blocker
      rather than inventing completion.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: validate-final
    actor: validator
    inputs:
      event: triage.inputs.event
      previous: repair.outputs.result
    instructions:
      The trusted coordinator waits for GitHub Actions checks and PR previews at the candidate
      commit. No validation workspace or agent is dispatched. Return verified CI receipts.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: review-final
    actor: reviewer
    inputs:
      event: triage.inputs.event
      previous: validate-final.outputs.result
    instructions:
      If a published independent approval already covers the unchanged candidate and current
      validation passes, the coordinator re-reads that approval and records it as reused without
      another reviewer session or GitHub review. Otherwise, in a clean checkout, inspect the candidate exact commit, issue, plan, all relevant
      changed source, GitHub Actions logs, screenshots displayed in the PR Demo,
      and the published PR preview. Build required targets before direct integration tests.
      Use the preview URLs in previous.previews and verify its revision; independently run targeted checks.
      Inspect previous.demo for screenshot gaps and previous.evidence for publisher-recorded
      receipts. Assess missing screenshots explicitly; request changes when they prevent adequate
      review. Do not edit or push implementation code. Return result containing ready true, verdict approved
      or changes-requested, and summary with concrete actionable defects or the evidence supporting
      approval and limitations. A failed check requires changes-requested. The coordinator publishes
      your formal GitHub review under the separate configured reviewer identity (Vega for this
      rollout), then reads it back. Review completion requires that published review, not just
      your local verdict or a comment.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
  - id: land
    actor: lander
    inputs:
      event: triage.inputs.event
      previous: review-final.outputs.result
    instructions:
      Return the preceding state unchanged. The trusted coordinator verifies current formal
      approval and checks before performing the protected merge; the agent must never invoke merge
      or change repository policy.
    outputs:
      result:
        schema:
          $ref: "#/$defs/state"
    when: triage.outputs.result.ready == true
outputs:
  triage: triage.outputs.result
  delivery: land.outputs.result
$defs:
  state:
    type: object
    required:
      - ready
      - summary
    properties:
      ready:
        type: boolean
      summary:
        type: string
        minLength: 1
      candidate:
        type: object
      evidence:
        type: array
        items:
          type: object
          required: [runId, headSha, url, sha256, filename]
          properties:
            runId: {type: string}
            headSha: {type: string}
            url: {type: string}
            sha256: {type: string}
            filename: {type: string}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
            expiresAt: {type: [number, "null"]}
      demo:
        type: object
        required: [status, missing]
        properties:
          status: {enum: [complete, needs-attention, not-required]}
          missing: {type: array, items: {type: string}}
      checks:
        type: array
      review:
        type:
          - object
          - "null"
      merge:
        type: object
      verdict:
        enum:
          - approved
          - changes-requested
    additionalProperties: true
