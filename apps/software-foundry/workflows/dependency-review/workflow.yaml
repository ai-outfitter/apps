version: beta
id: dependency-review
summary: Review a repository's dependencies — out of date, unneeded, or with a better option — and file one issue per proposed change.
actors:
  reviewer: {kind: resident}
triggers:
  - on: manual
  - on: schedule
    cron: "0 14 * * 1"
$defs:
  createdIssue:
    type: object
    required: [number, url, title]
    properties:
      number: {type: integer}
      url: {type: string, format: uri}
      title: {type: string}
steps:
  - id: analyze
    actor: reviewer
    uses: [git-forge]
    inputs:
      repository:
        schema: {type: string, pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"}
    instructions: |-
      Review this repository's dependencies the way a careful maintainer would, not the way Dependabot does.
      Read every manifest and lockfile in a shallow checkout (package.json workspaces, requirements, go.mod, Nix inputs, Dockerfiles, GitHub Actions). Run the ecosystem's own checks where they exist, such as `npm outdated --json` and `npm audit --json`; to make them work you may install into the scratch checkout with lifecycle scripts disabled (`npm ci --ignore-scripts`), but never upgrade, commit or push anything.
      For each dependency decide one of: keep, update (name the target version and read its changelog for breaking changes), remove (show by searching the code that nothing uses it, or that the platform now provides it), or replace (name the better option and why it is better here).
      File at most 10 issues, one per proposed change, most valuable first, and group trivial patch updates into one issue. Each issue states the evidence (command output, usages found), the risk, and a plan a separate implementation agent can follow, with the checks that prove it worked.
      Skip anything you cannot verify and say so in your final message rather than guessing. Filing no issues is a valid result.
    outputs:
      issues:
        connector: git-forge
        record: issue-batch.created
        match:
          repository: analyze.inputs.repository
        schema:
          type: object
          required: [repository, issues]
          properties:
            repository: {type: string}
            issues: {type: array, maxItems: 10, items: {$ref: "#/$defs/createdIssue"}}
            summary: {type: string}
outputs:
  issues: analyze.outputs.issues
