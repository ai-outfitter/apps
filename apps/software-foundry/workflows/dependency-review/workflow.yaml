version: beta
id: dependency-review
summary: Review a repository's dependencies — out of date, unneeded, or with a better option — and file one combined issue, plus one per major upgrade.
actors:
  reviewer:
    kind: external
    binding: analyze.inputs.reviewerBinding
triggers:
  - on: manual
  - on: schedule
    cron: "0 14 * * 1"
$defs:
  createdIssue:
    type: object
    required: [number, url, title]
    properties:
      number: {type: integer}
      url: {type: string, format: uri}
      title: {type: string}
      fixRun: {type: string}
steps:
  - id: analyze
    actor: reviewer
    inputs:
      reviewerBinding:
        schema: {type: string, minLength: 1}
      fix:
        schema:
          type: object
          required: [installation, resource, inputs]
          properties:
            installation: {type: string, minLength: 1}
            resource: {type: string, minLength: 1}
            inputs: {type: object, additionalProperties: {type: string}}
      repository:
        schema: {type: string, pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"}
    instructions: |-
      Review this repository's dependencies the way a careful maintainer would, not the way Dependabot does.
      Read every manifest and lockfile in a shallow checkout (package.json workspaces, requirements, go.mod, Nix inputs, Dockerfiles, GitHub Actions). Run the ecosystem's own checks where they exist, such as `npm outdated --json` and `npm audit --json`; to make them work you may install into the scratch checkout with lifecycle scripts disabled (`npm ci --ignore-scripts`), but never upgrade, commit or push anything.
      For each dependency decide one of: keep, update (name the target version and read its changelog for breaking changes), remove (show by searching the code that nothing uses it, or that the platform now provides it), or replace (name the better option and why it is better here).
      Each issue you file starts an agent that opens one pull request and merges it once checks pass, so file as few issues as the work allows:
      - One combined issue for every minor and patch update, security fix and removal together, to land as a single pull request.
      - One separate issue per major version upgrade or replacement only, at most 3, most valuable first.
      Before filing, read this repository's open issues. When an open issue already covers a change, leave it alone and do not file it again. While a combined dependency issue is open, never file a second one: comment your new findings on it (`gh issue comment`) instead; Foundry retries its fix.
      Each issue states the evidence (command output, usages found), the risk, and a plan a separate implementation agent can follow in one pull request, with the checks that prove it worked.
      Skip anything you cannot verify and say so in your final message rather than guessing. Filing no issues is a valid result.
    outputs:
      issues:
        schema:
          type: object
          required: [repository, issues]
          properties:
            repository: {type: string}
            issues: {type: array, maxItems: 4, items: {$ref: "#/$defs/createdIssue"}}
            retried: {type: array, items: {$ref: "#/$defs/createdIssue"}}
            closed: {type: array, items: {$ref: "#/$defs/createdIssue"}}
            summary: {type: string}
outputs:
  issues: analyze.outputs.issues
