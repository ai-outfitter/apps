version: beta
id: architecture-reanalysis
summary: Architecture reanalysis and refactor (ARR) — reread a repository as it is now and file ranked refactor issues for the debt fast shipping left behind.
actors:
  architect: {kind: resident}
triggers:
  - on: manual
  - on: schedule
    cron: "0 14 1 * *"
$defs:
  createdIssue:
    type: object
    required: [number, url, title]
    properties:
      number: {type: integer}
      url: {type: string, format: uri}
      title: {type: string}
steps:
  - id: analyze
    actor: architect
    uses: [git-forge]
    inputs:
      repository:
        schema: {type: string, pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"}
    instructions: |-
      Reread this repository as it is today. Agents and people have shipped a lot of it quickly to get demos and feedback; your job is to find the structure that no longer fits, not to restyle code.
      Work from a shallow checkout: read the README, docs, AGENTS.md or CLAUDE.md, the build and deploy configuration, CI, the database schema and migrations, and the largest and most-changed modules (use git log). You may run read-only commands such as listing files, `git log`, and the project's own lint or type checks; never install, change or commit anything.
      Look for: components that should be separate but share one store or deployment; data or artifacts kept in the wrong place (for example large bundles in memory or the database instead of object storage); duplicated mechanisms solving the same problem; tooling that is configured but unreliable or bypassed (flaky tests, disabled lint rules); layers that exist only for one caller; and docs that contradict the code.
      File at most 10 issues, ranked by value for the effort. Each names the current structure with file paths, why it now costs something (concrete incidents, duplication, or risk), the target structure, an incremental migration plan a separate implementation agent can follow in reviewable steps, and the checks that prove each step.
      Do not file style preferences or anything you cannot back with evidence from the repository. Filing no issues is a valid result; say what you checked in your final message.
    outputs:
      issues:
        connector: git-forge
        record: issue-batch.created
        match:
          repository: analyze.inputs.repository
        schema:
          type: object
          required: [repository, issues]
          properties:
            repository: {type: string}
            issues: {type: array, maxItems: 10, items: {$ref: "#/$defs/createdIssue"}}
            summary: {type: string}
outputs:
  issues: analyze.outputs.issues
