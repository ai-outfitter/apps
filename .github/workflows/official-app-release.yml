name: Build and publish one official app
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      ref:
        description: The release tag to build; the pushed commit when empty.
        type: string
        default: ''
    secrets:
      release-token:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate, test, and build this app
        env:
          APP: ${{ inputs.app }}
        run: node scripts/apps.mjs run "$APP"
      - name: Prepare release artifacts
        id: package
        env:
          APP: ${{ inputs.app }}
          OUTPUT: ${{ runner.temp }}/release
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          node scripts/official-app-artifact.mjs prepare "$APP" "$OUTPUT"
          echo "artifact=official-app-release-${APP#apps/}" >> "$GITHUB_OUTPUT"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Attach the verified package to its component release
        env:
          GH_TOKEN: ${{ secrets.release-token || github.token }}
          APP: ${{ inputs.app }}
          INPUT: ${{ runner.temp }}/release
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node scripts/official-app-artifact.mjs publish "$APP" "$INPUT"
