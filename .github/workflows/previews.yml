name: App PR previews
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  previews:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ai-outfitter/apps/.github/workflows/preview.yml@b8f6f3b07dbce1ab2996b0248f376ca3da7bbe6e
    with:
      pull-request: ${{ github.event.pull_request.number || inputs.pull_request }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
