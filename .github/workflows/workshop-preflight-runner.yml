name: Workshop fabrication runner
on:
  push:
    branches: [main]
    paths:
      - apps/workshop/box/workspace/**
      - apps/workshop/tests/preflight-release.py
      - apps/workshop/tests/fixtures/preflight/**
      - .github/workflows/workshop-preflight-runner.yml
  pull_request:
    paths:
      - apps/workshop/box/workspace/**
      - apps/workshop/tests/preflight-release.py
      - apps/workshop/tests/fixtures/preflight/**
      - .github/workflows/workshop-preflight-runner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify the packaged analyzers
        run: |
          docker build -t workshop-preflight apps/workshop/box/workspace
          python3 apps/workshop/tests/preflight-release.py workshop-preflight
