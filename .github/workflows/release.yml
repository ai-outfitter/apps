name: App releases
on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      release-token:
        required: false
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: outfitter-app-releases-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.release-token || github.token }}
        run: test -n "$RELEASE_TOKEN"
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.release-token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
