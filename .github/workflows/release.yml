name: App releases
on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      config-path:
        type: string
        default: .outfitter/apps.json
      destination:
        type: string
        default: https://ai-outfitter.com
      environment:
        type: string
        default: outfitter
      runner:
        type: string
        default: ubuntu-latest
    secrets:
      release-token:
        required: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
concurrency:
  group: outfitter-app-releases-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.events.outputs.releases || '[]' }}
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.release-token || github.token }}
        run: test -n "$RELEASE_TOKEN"
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.release-token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      - uses: actions/checkout@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          persist-credentials: false
      - name: Select newly published app releases
        if: steps.release.outputs.releases_created == 'true'
        id: events
        uses: ai-outfitter/apps@c8eaf7710e2a8c46c145bb99dedca3240b1ea166
        with:
          command: release-events
          config-path: ${{ inputs.config-path }}
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
  notify:
    needs: release
    if: needs.release.outputs.releases != '[]'
    uses: ai-outfitter/apps/.github/workflows/notify.yml@729bd783dc5dde1859c27adba0699be6473bb1f8
    permissions:
      contents: read
      id-token: write
    with:
      releases: ${{ needs.release.outputs.releases }}
      destination: ${{ inputs.destination }}
      environment: ${{ inputs.environment }}
      runner: ${{ inputs.runner }}
