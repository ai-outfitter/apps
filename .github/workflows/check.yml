name: App checks
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: .outfitter/apps.json
      sdk-sha:
        description: Optional full public ai-outfitter/apps SDK commit
        type: string
        default: ''
      app-set:
        description: Validation cohort (all, catalog or source)
        type: string
        default: all
      catalog-apps:
        description: Official app paths registered in the platform catalog (JSON array)
        type: string
        default: '[]'
      baseline-workflow:
        description: Calling workflow file used to find last successful push
        type: string
        default: ci.yml
      push-baseline:
        description: Caller-resolved push baseline, empty to check all apps or auto to look it up
        type: string
        default: auto
    outputs:
      apps:
        description: Affected app paths
        value: ${{ jobs.plan.outputs.apps }}
      non_catalog_apps:
        description: Checked apps outside the platform catalog
        value: ${{ jobs.plan.outputs.non_catalog_apps }}
      catalog_apps:
        description: Checked official catalog app paths
        value: ${{ jobs.plan.outputs.catalog_apps }}
      has_apps:
        description: Whether apps were selected
        value: ${{ jobs.plan.outputs.has_apps }}
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.catalog.outputs.selected }}
      has_apps: ${{ steps.catalog.outputs.has_apps }}
      sdk_sha: ${{ steps.plan.outputs.sdk_sha }}
      catalog_apps: ${{ steps.catalog.outputs.apps }}
      non_catalog_apps: ${{ steps.catalog.outputs.other }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Last successful caller push
        if: github.event_name == 'push'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BASELINE: ${{ inputs.push-baseline }}
          BASELINE_WORKFLOW: ${{ inputs.baseline-workflow }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          base=$PUSH_BASELINE
          if [[ "$base" == auto ]]; then
            [[ "$BASELINE_WORKFLOW" =~ ^[a-zA-Z0-9._-]+\.ya?ml$ ]]
            base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$BASELINE_WORKFLOW/runs" \
              -f "branch=$BRANCH" -f event=push -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty') || base=
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        with:
          command: plan
          config-path: ${{ inputs.config-path }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
      - id: catalog
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          SELECTED_APPS: ${{ steps.plan.outputs.apps }}
          CATALOG_APPS: ${{ inputs.catalog-apps }}
          APP_SET: ${{ inputs.app-set }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        # Validate direct changes and the apps that consume configured shared inputs.
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { matchesGlob } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const {BASE_SHA: base, HEAD_SHA: head} = process.env;
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'});
          let paths = null;
          try {if (base) paths = git('diff', '--no-renames', '--name-only', '-z', git('merge-base', base, head).trim(), head, '--').split('\0').filter(Boolean);} catch {}
          const configPath = process.env.CONFIG_PATH;
          const {sharedInputs = [], sharedInputApps = []} = existsSync(configPath) ? JSON.parse(readFileSync(configPath, 'utf8')) : {};
          const sharedApps = paths?.some(path => sharedInputs.some(glob => matchesGlob(path, glob))) ? sharedInputApps : [];
          const affected = JSON.parse(process.env.SELECTED_APPS).filter(app => !paths || sharedApps.includes(app) || paths.some(path => path.startsWith(`${app}/`)));
          const cohort = process.env.APP_SET;
          assert.ok(['all','catalog','source'].includes(cohort), 'Unknown validation cohort');
          const registered = JSON.parse(process.env.CATALOG_APPS);
          const selected = affected.filter(app => cohort === 'all' || (cohort === 'catalog') === registered.includes(app));
          appendFileSync(process.env.GITHUB_OUTPUT, `selected=${JSON.stringify(selected)}\nhas_apps=${selected.length > 0}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `apps=${JSON.stringify(selected.filter(app => registered.includes(app)))}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `other=${JSON.stringify(selected.filter(app => !registered.includes(app)))}\n`);
          NODE
  app:
    name: App validation (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public SDK pin
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        env:
          SDK_SHA: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
        run: '[[ "$SDK_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        with:
          repository: ai-outfitter/apps
          ref: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
          path: .outfitter-sdk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - id: config
        uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        with:
          command: plan
          config-path: ${{ inputs.config-path }}
      - name: Identify the locked Playwright browser set
        if: steps.config.outputs.validation == 'scripts'
        id: playwright
        env:
          APP: ${{ matrix.app }}
        run: |
          if jq -e '.outfitter.browserTests == true' "$APP/package.json" > /dev/null; then
            version=$(jq -r '.packages["node_modules/playwright-core"].version // empty' package-lock.json)
            if [[ -n "$version" ]]; then
              echo "key=playwright-chromium-$ImageOS-$RUNNER_ARCH-$version" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Cache Chromium and Playwright helpers
        if: steps.playwright.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        with:
          command: ${{ steps.config.outputs.validation == 'scripts' && 'run' || 'check' }}
          app: ${{ matrix.app }}
          config-path: ${{ inputs.config-path }}
      - name: Retain checked catalog inputs
        if: contains(fromJSON(inputs.catalog-apps), matrix.app) && contains(fromJSON('["ai-outfitter/apps","ai-outfitter/apps-private"]'), github.repository) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP: ${{ matrix.app }}
        # Callers run the tooling from their pinned public SDK checkout.
        run: |
          tooling=scripts
          [ -f .outfitter-sdk/scripts/catalog-publication.mjs ] && tooling=.outfitter-sdk/scripts
          node "$tooling/catalog-publication.mjs" prepare "$APP" "$RUNNER_TEMP/catalog/bundle.json"
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON(inputs.catalog-apps), matrix.app) && contains(fromJSON('["ai-outfitter/apps","ai-outfitter/apps-private"]'), github.repository) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: catalog-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog/bundle.json
          if-no-files-found: error
          retention-days: 7
      - name: Record validation provenance
        env:
          APP: ${{ matrix.app }}
          VALIDATION: ${{ steps.config.outputs.validation }}
          TOOLING_SHA: 0aec26e694bfe20eea4bdae12b073a59c11416d3
        run: |
          node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync("outfitter-provenance.json",JSON.stringify({app:process.env.APP,validation:process.env.VALIDATION,sourceRepository:process.env.GITHUB_REPOSITORY,sourceSha:process.env.GITHUB_SHA,toolingSha:process.env.TOOLING_SHA,runId:process.env.GITHUB_RUN_ID},null,2))'
          echo "App: $APP. Validation: $VALIDATION. Metadata checks do not certify app runtime, tests or builds." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-validation-${{ inputs.app-set }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: outfitter-provenance.json
          if-no-files-found: error
  gate:
    name: CI gate
    if: always()
    needs: [plan, app]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          HAS_APPS: ${{ needs.plan.outputs.has_apps }}
          APPS: ${{ needs.app.result }}
        run: |
          test "$PLAN" = success
          if [ "$HAS_APPS" = true ]; then test "$APPS" = success; fi
