name: Tooling CI
on:
  pull_request:
  push:
    branches: [main, ci/shared-tooling]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: docker://rhysd/actionlint:1.7.12
