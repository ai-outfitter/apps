name: Tooling CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.paths.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo sdk=true >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/sdk-paths"
            if grep -Eq '^(packages/|scripts/(check-sdk-packages|publish-sdk-archives|sdk-workspaces)\.mjs$|package(-lock)?\.json$|tsconfig\.json$|\.github/workflows/(ci|sdk-releases)\.yml$)' "$RUNNER_TEMP/sdk-paths"; then
              echo sdk=true >> "$GITHUB_OUTPUT"
            fi
          fi
  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sdk
      - run: npm run test:sdk
      - run: npm run build:sdk
      - run: node scripts/check-sdk-packages.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: docker://rhysd/actionlint:1.7.12

  apps:
    uses: ./.github/workflows/check.yml
    with:
      config-path: .outfitter/apps.json
      catalog-apps: '["apps/hr","apps/html-starter","apps/onto","apps/software-foundry","apps/wiki","apps/workshop"]'
  # Publish the exact checked bytes once; the platform registry reconciles
  # catalog/demo targets and eligible installations without a webapp release.
  deploy:
    needs: apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apps.outputs.catalog_apps != '[]'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/catalog-deploy.yml
    with:
      apps: ${{ needs.apps.outputs.catalog_apps }}
  deploy-source-apps:
    needs: apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apps.outputs.non_catalog_apps != '[]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      apps: ${{ needs.apps.outputs.non_catalog_apps }}
