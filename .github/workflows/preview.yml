name: Changed app previews
on:
  workflow_call:
    inputs:
      pull-request:
        type: number
        required: true
      config-path:
        type: string
        default: .outfitter/apps.json
      build-mode:
        type: string
        default: package
      sdk-sha:
        description: Optional full public ai-outfitter/apps SDK commit
        type: string
        default: ''
      trusted-build-actors:
        description: Explicit actor and PR-author allowlist for automatic private SDK builds
        type: string
        default: '[]'
      toolchain-sha:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      OUTFITTER_TOOLCHAIN_SSH_KEY:
        required: false
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.repository_id }}-${{ inputs.pull-request }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      closed: ${{ steps.pr.outputs.closed }}
      private_authorized: ${{ steps.pr.outputs.private_authorized }}
      apps: ${{ steps.plan.outputs.apps }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
      sdk_sha: ${{ steps.plan.outputs.sdk_sha }}
    steps:
      - uses: ai-outfitter/apps@0aec26e694bfe20eea4bdae12b073a59c11416d3
        id: pr
        with:
          command: preview-plan
          build-mode: ${{ inputs.build-mode }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          PREVIEW_BUILD_MODE: ${{ inputs.build-mode }}
          TOOLCHAIN_SHA: ${{ inputs.toolchain-sha }}
          TRUSTED_BUILD_ACTORS: ${{ inputs.trusted-build-actors }}
      - name: Require verified planner outputs
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          BASE: ${{ steps.pr.outputs.base }}
          CLOSED: ${{ steps.pr.outputs.closed }}
          AUTHORIZED: ${{ steps.pr.outputs.private_authorized }}
          MODE: ${{ inputs.build-mode }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]]
          if [ "$MODE" = toolchain ] && [ "$CLOSED" != true ]; then test "$AUTHORIZED" = true; fi
      - uses: actions/checkout@v4
        if: steps.pr.outputs.closed != 'true'
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate PR merge base
        if: steps.pr.outputs.closed != 'true'
        id: base
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.sha }}
        run: |
          base=$(git merge-base "$BASE" "$HEAD")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: ai-outfitter/apps@0aec26e694bfe20eea4bdae12b073a59c11416d3
        if: steps.pr.outputs.closed != 'true'
        id: plan
        with:
          command: plan
          config-path: ${{ inputs.config-path }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
  build:
    needs: plan
    if: needs.plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    environment: preview-build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Validate public SDK pin
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        env:
          SDK_SHA: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
        run: '[[ "$SDK_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        with:
          repository: ai-outfitter/apps
          ref: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
          path: .outfitter-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.build-mode == 'toolchain'
        with:
          repository: ai-outfitter/webapp
          ref: ${{ inputs.toolchain-sha }}
          ssh-key: ${{ secrets.OUTFITTER_TOOLCHAIN_SSH_KEY }}
          persist-credentials: false
          path: .preview-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install reviewed SDK toolchain
        if: inputs.build-mode == 'toolchain'
        run: npm ci
        working-directory: .preview-toolchain
      - uses: ai-outfitter/apps@0aec26e694bfe20eea4bdae12b073a59c11416d3
        with:
          command: preview-build
          app: ${{ matrix.app }}
          build-mode: ${{ inputs.build-mode }}
          toolchain-path: ${{ github.workspace }}/.preview-toolchain
          config-path: ${{ inputs.config-path }}
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          PRIVATE_PREVIEW_AUTHORIZED: ${{ needs.plan.outputs.private_authorized }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .outfitter-preview/bundle.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-publish
      url: ${{ steps.publish.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      # Deliberately no caller checkout, installs or app script execution here.
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)});
            if(pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) throw Error('PR closed or source superseded');
      - uses: actions/download-artifact@v8
        with:
          name: preview-build-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .outfitter-preview
      - uses: ai-outfitter/apps@0aec26e694bfe20eea4bdae12b073a59c11416d3
        id: publish
        with:
          command: preview-publish
          app: ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OUTFITTER_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/github-script@v7
        env:
          APP: ${{ matrix.app }}
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const issue_number=Number(process.env.PR_NUMBER);
            const {data: pr}=await github.rest.pulls.get({...context.repo,pull_number:issue_number});
            if(pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) throw Error('Preview became superseded');
            const marker=`<!-- outfitter-preview:${process.env.APP} -->`;
            const body=`${marker}\nRead-only preview: [${process.env.APP}](${process.env.PREVIEW_URL})\n\nVerified source: \`${process.env.SOURCE_SHA}\`. Synthetic demo data; no installed customer data or platform API.\n\n[Publishing run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number});
            const existing=comments.find(c=>c.user.type==='Bot' && c.body.startsWith(marker));
            if(existing) await github.rest.issues.updateComment({...context.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({...context.repo,issue_number,body});
  cleanup:
    needs: plan
    if: needs.plan.outputs.closed == 'true'
    runs-on: ubuntu-latest
    environment: preview-publish
    steps:
      - uses: ai-outfitter/apps@0aec26e694bfe20eea4bdae12b073a59c11416d3
        with:
          command: preview-cleanup
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OUTFITTER_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
