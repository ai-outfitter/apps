name: Changed app previews
on:
  workflow_call:
    inputs:
      pull-request:
        type: number
        required: true
      config-path:
        type: string
        default: .outfitter/apps.json
      build-mode:
        type: string
        default: package
      sdk-sha:
        description: Optional full public ai-outfitter/apps SDK commit
        type: string
        default: ''
      trusted-build-actors:
        description: Explicit actor and PR-author allowlist for automatic private SDK builds
        type: string
        default: '[]'
      toolchain-sha:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      OUTFITTER_TOOLCHAIN_SSH_KEY:
        required: false
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.repository_id }}-${{ inputs.pull-request }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      closed: ${{ steps.pr.outputs.closed }}
      private_authorized: ${{ steps.pr.outputs.private_authorized }}
      apps: ${{ steps.direct.outputs.apps }}
      has_apps: ${{ steps.direct.outputs.has_apps }}
      sdk_sha: ${{ steps.plan.outputs.sdk_sha }}
    steps:
      - uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        id: pr
        with:
          command: preview-plan
          build-mode: ${{ inputs.build-mode }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          PREVIEW_BUILD_MODE: ${{ inputs.build-mode }}
          TOOLCHAIN_SHA: ${{ inputs.toolchain-sha }}
          TRUSTED_BUILD_ACTORS: ${{ inputs.trusted-build-actors }}
      - name: Require verified planner outputs
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          BASE: ${{ steps.pr.outputs.base }}
          CLOSED: ${{ steps.pr.outputs.closed }}
          AUTHORIZED: ${{ steps.pr.outputs.private_authorized }}
          MODE: ${{ inputs.build-mode }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]]
          if [ "$MODE" = toolchain ] && [ "$CLOSED" != true ]; then test "$AUTHORIZED" = true; fi
      - uses: actions/checkout@v4
        if: steps.pr.outputs.closed != 'true'
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate PR merge base
        if: steps.pr.outputs.closed != 'true'
        id: base
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.sha }}
        run: |
          base=$(git merge-base "$BASE" "$HEAD")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        if: steps.pr.outputs.closed != 'true'
        id: plan
        with:
          command: plan
          config-path: ${{ inputs.config-path }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
      # Previews show an app's own UI change. A shared package or lockfile
      # change still validates every dependent app, but only apps with files
      # changed in their own directory get a preview.
      - id: direct
        if: steps.pr.outputs.closed != 'true'
        env:
          SELECTED_APPS: ${{ steps.plan.outputs.apps }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const paths = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA, '--'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          const apps = JSON.parse(process.env.SELECTED_APPS).filter(app => paths.some(path => path.startsWith(`${app}/`)));
          appendFileSync(process.env.GITHUB_OUTPUT, `apps=${JSON.stringify(apps)}\nhas_apps=${apps.length > 0}\n`);
          NODE
  build-and-publish:
    needs: plan
    if: needs.plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview-publish
      url: ${{ steps.publish.outputs.url }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Validate public SDK pin
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        env:
          SDK_SHA: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
        run: '[[ "$SDK_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        if: inputs.sdk-sha != '' || needs.plan.outputs.sdk_sha != ''
        with:
          repository: ai-outfitter/apps
          ref: ${{ inputs.sdk-sha || needs.plan.outputs.sdk_sha }}
          path: source/.outfitter-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.build-mode == 'toolchain'
        with:
          repository: ai-outfitter/webapp
          ref: ${{ inputs.toolchain-sha }}
          ssh-key: ${{ secrets.OUTFITTER_TOOLCHAIN_SSH_KEY }}
          persist-credentials: false
          path: source/.preview-toolchain
      - name: Check out pinned preview builder
        uses: actions/checkout@v4
        with:
          repository: ai-outfitter/apps
          ref: 33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
          path: builder
          sparse-checkout: scripts
          persist-credentials: false
      - name: Build demo package in a disposable container
        env:
          APP: ${{ matrix.app }}
          CONFIG_PATH: ${{ inputs.config-path }}
          PREVIEW_BUILD_MODE: ${{ inputs.build-mode }}
          PRIVATE_PREVIEW_AUTHORIZED: ${{ needs.plan.outputs.private_authorized }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir .outfitter-preview
          touch .outfitter-preview/bundle.json
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/source:/source:ro" -v "$PWD/builder:/builder:ro" \
            -v "$PWD/.outfitter-preview/bundle.json:/output.json" \
            -e APP -e CONFIG_PATH -e CI -e GITHUB_EVENT_NAME -e GITHUB_REPOSITORY \
            -e PREVIEW_BUILD_MODE -e PRIVATE_PREVIEW_AUTHORIZED -e SOURCE_SHA \
            -e HOME=/tmp -e TOOLCHAIN_PATH=/tmp/build/.preview-toolchain \
            docker.io/library/node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496 bash -eu -c '
              mkdir /tmp/build
              cd /tmp/build
              cp -R /source/. .
              if [[ "$PREVIEW_BUILD_MODE" == toolchain ]]; then
                (cd "$TOOLCHAIN_PATH" && npm ci)
              fi
              node /builder/scripts/preview.mjs build "$APP"
              cat .outfitter-preview/bundle.json > /output.json'
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)});
            if(pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) throw Error('PR closed or source superseded');
      - uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        id: publish
        with:
          command: preview-publish
          app: ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: 52b3dd3372a05fd2be0eb0f8ec36f9d3
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/github-script@v7
        env:
          APP: ${{ matrix.app }}
          PR_NUMBER: ${{ inputs.pull-request }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const issue_number=Number(process.env.PR_NUMBER);
            const {data: pr}=await github.rest.pulls.get({...context.repo,pull_number:issue_number});
            if(pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) throw Error('Preview became superseded');
            const marker=`<!-- outfitter-preview:${process.env.APP} -->`;
            const body=`${marker}\nRead-only preview: [${process.env.APP}](${process.env.PREVIEW_URL})\n\nVerified source: \`${process.env.SOURCE_SHA}\`. Synthetic demo data; no installed customer data or platform API.\n\n[Publishing run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number});
            const existing=comments.find(c=>c.user.type==='Bot' && c.body.startsWith(marker));
            if(existing) await github.rest.issues.updateComment({...context.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({...context.repo,issue_number,body});
  cleanup:
    needs: plan
    if: needs.plan.outputs.closed == 'true'
    runs-on: ubuntu-latest
    environment: preview-publish
    steps:
      - uses: ai-outfitter/apps@33a6c545a1d2b89780c857d8a1d7c9e6858d09b8
        with:
          command: preview-cleanup
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
          CLOUDFLARE_ACCOUNT_ID: 52b3dd3372a05fd2be0eb0f8ec36f9d3
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
