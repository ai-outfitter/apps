name: Official app releases
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      config-file: .release-please-apps.json
      manifest-file: .release-please-apps-manifest.json
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
