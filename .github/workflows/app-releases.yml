name: Official app releases
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: official-app-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-apps.json
          manifest-file: .release-please-apps-manifest.json
  app:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.paths) }}
    uses: ./.github/workflows/official-app-release.yml
    with:
      app: ${{ matrix.app }}
      # One event can discover several merged releases. Build each immutable tag commit.
      ref: ${{ fromJSON(needs.release.outputs.releases)[format('{0}--sha', matrix.app)] }}
    permissions:
      contents: write
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
