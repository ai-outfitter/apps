name: Official app releases
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      releases:
        description: JSON array of existing releases to notify again
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      config-file: .release-please-apps.json
      manifest-file: .release-please-apps-manifest.json
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
      releases: ${{ inputs.releases || '' }}
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
